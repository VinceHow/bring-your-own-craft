<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakery Orders</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cellipse cx=%2232%22 cy=%2236%22 rx=%2228%22 ry=%2220%22 fill=%22%23a8551f%22/%3E%3Cpath d=%22M16 30q6-8 12 0M28 26q6-8 12 0M40 30q6-8 12 0%22 stroke=%22%23f6e8db%22 stroke-width=%224%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin { padding: 28px 0 64px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
    .toolbar input[type=date] { width: auto; }
    .toolbar h1 { font-size: 1.6rem; margin-right: auto; }
    .upcoming { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
    .upcoming .day { width: auto; padding: 6px 10px; }
    .admin-grid { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
    .box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .box h2 { font-size: 1.15rem; margin-bottom: 10px; }
    .bake td, .bake th { padding: 5px 0; text-align: left; }
    .bake td:last-child, .bake th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .bake { width: 100%; border-collapse: collapse; }
    .bake tr + tr td { border-top: 1px solid var(--line); }
    .orders { display: grid; gap: 12px; }
    .order { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
    .order.cancelled, .order.collected { opacity: .6; }
    .order-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
    .order-head .time { font-weight: 700; font-size: 1.1rem; }
    .order-head .who { font-weight: 600; }
    .order-head .code { font-size: .95rem; letter-spacing: .08em; }
    .order-meta { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
    .order .notes { background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; font-size: .9rem; margin: 8px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .login { max-width: 360px; margin: 80px auto; }
    @media print {
      .site-header, .toolbar button, .toolbar input, .upcoming, .actions, .filters { display: none !important; }
      body { background: #fff; }
      .order, .box { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap"><a class="brand" href="/admin">Orders dashboard</a><a href="/" class="header-meta">View shop →</a></div>
  </header>

  <main class="wrap">
    <form class="box login" id="login" hidden>
      <h2>Staff sign in</h2>
      <div class="errors" id="login-error" hidden></div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn block" style="margin-top:14px">Sign in</button>
    </form>

    <div class="admin" id="dash" hidden>
      <div class="toolbar">
        <h1 id="day-title"></h1>
        <button class="btn secondary small" id="prev" type="button" aria-label="Previous day">←</button>
        <input type="date" id="date" aria-label="Pickup date">
        <button class="btn secondary small" id="next" type="button" aria-label="Next day">→</button>
        <button class="btn secondary small" id="today" type="button">Today</button>
        <button class="btn secondary small" id="refresh" type="button">Refresh</button>
        <button class="btn secondary small" type="button" onclick="print()">Print</button>
      </div>
      <div class="upcoming" id="upcoming"></div>

      <div class="admin-grid">
        <aside class="box">
          <h2>Bake list</h2>
          <div id="bake"></div>
        </aside>
        <section>
          <div class="filters" id="filters"></div>
          <div class="orders" id="orders"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
