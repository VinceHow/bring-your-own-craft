<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Priya's: the baker's view</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F4EEE4; }
  body { color: #241A12; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* Laid out at 1920x1080 and scaled to whatever the screen is. */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .wire { display: grid; grid-template-columns: 1140px 1fr; grid-template-rows: 110px 1fr 150px; gap: 0 56px; height: 100%; padding: 40px 64px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 4px solid #241A12; outline-offset: 3px; }

  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 28px; }
  header h1 { margin: 0; font: 600 44px/1 Georgia, "Iowan Old Style", serif; }
  header .demo { font: 500 24px/1 system-ui, sans-serif; color: #5E4E3F; }
  header .quiet { margin-left: auto; display: flex; gap: 14px; }
  .pill { font: 500 22px/1 system-ui, sans-serif; color: #5E4E3F; padding: 12px 20px; border: 2px solid #8F7F6D; border-radius: 999px; background: none; }
  .pill.sure { color: #A33A22; border-color: #A33A22; font-weight: 700; }

  h2 { margin: 0 0 18px; font: 600 30px/1 system-ui, sans-serif; color: #5E4E3F; }
  .orders { min-height: 0; }
  .row { display: grid; grid-template-columns: 300px 1fr 150px 230px; align-items: center; height: 92px; border-bottom: 2px solid #E2D7C7; }
  .row .who { font: 700 44px/1 Georgia, serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .loaf { font: 400 34px/1 system-ui, sans-serif; }
  .row .t { font: 400 30px/1 system-ui, sans-serif; color: #5E4E3F; }
  .row .st { justify-self: end; font: 700 28px/1 system-ui, sans-serif; padding: 12px 22px; border-radius: 999px; background: #F2C25B; color: #241A12; }
  .row.delivered .st { background: none; border: 3px solid #2F6B3D; color: #2F6B3D; transform: rotate(-4deg); }
  .row.released .st { background: none; border: 3px solid #6F6152; color: #5E4E3F; }
  .row.delivered .who, .row.delivered .loaf, .row.released .who, .row.released .loaf { color: #6F6152; }
  .more { font: 400 28px/1 system-ui, sans-serif; color: #5E4E3F; margin-top: 16px; }
  .empty { font: italic 400 34px/1.3 Georgia, serif; color: #5E4E3F; padding-top: 24px; }

  .loafrow { display: grid; grid-template-columns: 1fr 200px; align-items: center; height: 150px; border-bottom: 2px solid #E2D7C7; position: relative; }
  .loafrow .n { font: 600 40px/1.1 Georgia, serif; }
  .loafrow .c { font: 700 88px/1 Georgia, serif; text-align: right; }
  .loafrow.out .n, .loafrow.out .c { color: #6F6152; }
  .loafrow .stampout { display: none; position: absolute; right: 0; top: 50%; transform: translateY(-50%) rotate(-8deg);
    font: 800 54px/1 Georgia, serif; color: #A33A22; border: 5px solid #A33A22; border-radius: 14px; padding: 6px 22px; background: #F4EEE4; }
  .loafrow.out .stampout { display: block; }
  .loafrow.out .c { visibility: hidden; }

  .deliver { grid-column: 1; align-self: end; height: 120px; border: 0; border-radius: 28px; background: #2A1B10; color: #FFF6E8; font: 700 48px/1 system-ui, sans-serif; width: 100%; }
  .deliver[aria-disabled="true"] { background: #4A3A2D; color: #E8DCCB; cursor: default; }
  .hold { grid-column: 2; align-self: end; font: 400 26px/1.3 system-ui, sans-serif; color: #5E4E3F; padding-bottom: 20px; display: flex; gap: 28px; align-items: baseline; }
  .hold a { font: 400 22px/1 system-ui, sans-serif; color: #5E4E3F; margin-left: auto; background: none; border: 0; text-decoration: underline; }

  /* settings: opened from the small link, otherwise not on screen */
  #settings { position: absolute; inset: 0; background: #F4EEE4; padding: 64px 120px; display: none; }
  #settings.open { display: block; }
  #settings h2 { font: 600 44px/1 Georgia, serif; color: #241A12; margin-bottom: 36px; }
  .field { display: grid; grid-template-columns: 520px 220px; align-items: center; gap: 24px; font: 400 32px/1 system-ui, sans-serif; margin-bottom: 22px; }
  .field input { font: 600 32px/1 system-ui, sans-serif; padding: 14px 16px; border: 2px solid #5E4E3F; border-radius: 12px; background: #FFFBF4; width: 100%; }
  .sbtns { display: flex; gap: 20px; margin-top: 36px; }
  .sbtns .pill { font-size: 28px; padding: 16px 30px; }
  .sbtns .go { background: #2A1B10; color: #FFF6E8; border-color: #2A1B10; }
  #smsg { font: 400 26px/1.3 system-ui, sans-serif; color: #5E4E3F; margin-top: 24px; min-height: 34px; }
  #locked { position: absolute; inset: 0; background: #F4EEE4; display: none; font: 44px/1.3 Georgia, serif; padding: 200px 160px; }
</style>
</head>
<body>
<div id="stage">
  <div class="wire">
    <header>
      <h1>Priya's</h1><span class="demo">Demo bakery, no real bread</span>
      <div class="quiet"><button class="pill" id="restock" type="button">Restock</button><button class="pill" id="reset" type="button">Reset demo</button></div>
    </header>
    <section class="orders"><h2>Orders, newest first</h2><div id="orders"></div></section>
    <section class="stock"><h2>On the shelf</h2><div id="stock"></div></section>
    <button class="deliver" id="deliver" type="button" aria-disabled="true">Nothing to deliver</button>
    <div class="hold"><span>Held until the end of the talk</span><button class="a" id="open-settings" type="button" style="all:unset;cursor:pointer;font:400 22px/1 system-ui,sans-serif;color:#5E4E3F;margin-left:auto;text-decoration:underline">settings</button></div>
  </div>
  <div id="settings">
    <h2>Settings</h2>
    <label class="field">How long a reservation is held, in minutes<input id="s-hold" type="number" min="1" max="240" step="1"></label>
    <div id="s-stock"></div>
    <div class="sbtns"><button class="pill go" id="s-save" type="button">Save</button><button class="pill" id="s-close" type="button">Close</button></div>
    <p id="smsg"></p>
  </div>
  <div id="locked">Locked. Open this page from the link with your token.</div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const stage = $('#stage');
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = `${(innerWidth - 1920 * s) / 2}px`; stage.style.top = `${(innerHeight - 1080 * s) / 2}px`;
  }
  addEventListener('resize', fit); fit();

  const lock = () => { $('#locked').style.display = 'block'; };
  async function api(path, opts) {
    const r = await fetch(path, { credentials: 'same-origin', ...opts });
    if (r.status === 401) { lock(); throw new Error('locked'); }
    return r.json();
  }
  const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });

  let loafNames = {};
  let sigOrders = '', sigStock = '', reservedCount = -1;
  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

  function renderOrders(orders) {
    const sig = JSON.stringify(orders.map((o) => [o.id, o.status]).slice(0, 6)) + orders.length;
    if (sig !== sigOrders) {
      sigOrders = sig;
      const box = $('#orders'); box.replaceChildren();
      if (!orders.length) box.appendChild(el('p', 'empty', 'No orders yet.'));
      for (const o of orders.slice(0, 5)) {
        const row = el('div', `row ${o.status}`);
        row.append(el('span', 'who', o.first_name), el('span', 'loaf', loafNames[o.loaf_id] || o.loaf_id), el('span', 't', clock(o.at)),
          el('span', 'st', o.status === 'reserved' ? 'Reserved' : o.status === 'delivered' ? 'Delivered' : 'Released'));
        box.appendChild(row);
      }
      if (orders.length > 5) box.appendChild(el('p', 'more', `and ${orders.length - 5} more`));
    }
    const n = orders.filter((o) => o.status === 'reserved').length;
    if (n !== reservedCount) {
      reservedCount = n;
      const b = $('#deliver');
      b.textContent = n ? `Deliver all ${n} reserved` : 'Nothing to deliver';
      b.setAttribute('aria-disabled', n ? 'false' : 'true');
    }
  }

  function renderStock(loaves) {
    loafNames = Object.fromEntries(loaves.map((l) => [l.id, l.name]));
    const sig = JSON.stringify(loaves);
    if (sig === sigStock) return;
    sigStock = sig;
    const box = $('#stock'); box.replaceChildren();
    for (const l of loaves) {
      const row = el('div', `loafrow${l.sold_out ? ' out' : ''}`);
      row.append(el('span', 'n', l.name), el('span', 'c', String(l.left)), el('span', 'stampout', 'Sold out'));
      box.appendChild(row);
    }
  }

  async function refresh() {
    try {
      const [s, o] = await Promise.all([api('/api/admin/stock'), api('/api/admin/orders')]);
      renderStock(s.loaves); renderOrders(o.orders);
    } catch { /* locked, or the network blinked: the next tick tries again */ }
  }

  // live: the server says "changed", we refetch; a slow poll is the backup
  if ('EventSource' in window) { const es = new EventSource('/api/admin/events'); es.onmessage = refresh; }
  setInterval(refresh, 4000);
  refresh();

  let busy = false;
  $('#deliver').addEventListener('click', async () => {
    if (busy || $('#deliver').getAttribute('aria-disabled') === 'true') return;
    busy = true;
    try { await post('/api/admin/deliver'); await refresh(); } finally { busy = false; }
  });
  $('#restock').addEventListener('click', async () => { await post('/api/admin/restock'); refresh(); });

  let sureTimer = null;
  $('#reset').addEventListener('click', async (e) => {
    const b = e.currentTarget;
    if (!b.classList.contains('sure')) {
      b.classList.add('sure'); b.textContent = 'Tap again to reset';
      sureTimer = setTimeout(() => { b.classList.remove('sure'); b.textContent = 'Reset demo'; }, 4000);
      return;
    }
    clearTimeout(sureTimer); b.classList.remove('sure'); b.textContent = 'Reset demo';
    await post('/api/admin/reset'); sigOrders = ''; sigStock = ''; refresh();
  });

  // settings
  async function openSettings() {
    const s = await api('/api/admin/settings');
    $('#s-hold').value = s.hold_minutes;
    const box = $('#s-stock'); box.replaceChildren();
    for (const [id, n] of Object.entries(s.stock)) {
      const lab = el('label', 'field', `${loafNames[id] || id}: starting stock`); const inp = el('input'); inp.type = 'number'; inp.min = 0; inp.max = 500; inp.step = 1; inp.dataset.id = id; inp.value = n;
      lab.appendChild(inp); box.appendChild(lab);
    }
    $('#smsg').textContent = 'Stock changes apply at the next Restock.';
    $('#settings').classList.add('open');
  }
  $('#open-settings').addEventListener('click', openSettings);
  $('#s-close').addEventListener('click', () => $('#settings').classList.remove('open'));
  $('#s-save').addEventListener('click', async () => {
    const stock = {};
    document.querySelectorAll('#s-stock input').forEach((i) => { stock[i.dataset.id] = Number(i.value); });
    const out = await post('/api/admin/settings', { hold_minutes: Number($('#s-hold').value), stock });
    $('#smsg').textContent = out.error ? out.message : 'Saved. Stock changes apply at the next Restock.';
  });
})();
</script>
</body>
</html>
