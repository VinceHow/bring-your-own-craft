<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bring your own craft</title>
<link rel="stylesheet" href="room.css">
</head>
<body data-beat="0">
<!-- Chrome: hidden in stage mode -->
<div id="chrome" class="chrome">
  <span class="chrome-title">Bring your own craft</span>
  <span class="chrome-keys"><kbd>&rarr;</kbd> next beat <kbd>S</kbd> stage mode <kbd>R</kbd> replay rehearsal <kbd>J</kbd> judge's idea <kbd>?</kbd> all keys</span>
  <span id="status" class="chrome-status"></span>
</div>

<!-- Labels shown for as long as a replayed or fake run is on screen -->
<div id="replay-label" class="replay-label" data-component="replay-label" data-state="hidden" hidden></div>

<div id="viewport">
<main id="room" aria-label="The room, seen from above">
  <div class="table" id="table"></div>

  <!-- Seats: empty outlines until the cards land -->
  <div class="seat seat-design" data-seat="design" data-component="seat" data-state="empty"><div class="seat-empty" data-slot="empty-label">Design</div></div>
  <div class="seat seat-data" data-seat="data" data-component="seat" data-state="empty"><div class="seat-empty" data-slot="empty-label">Data</div></div>
  <div class="seat seat-research" data-seat="research" data-component="seat" data-state="empty"><div class="seat-empty" data-slot="empty-label">Research</div></div>
  <div class="seat seat-strategy" data-seat="strategy" data-component="seat" data-state="empty"><div class="seat-empty" data-slot="empty-label">Strategy</div></div>
  <div class="seat seat-engineering" data-seat="engineering" data-component="seat" data-state="empty"><div class="seat-empty" data-slot="empty-label">Engineering</div></div>
  <div class="seat seat-product" data-seat="product" data-component="seat" data-state="empty"><div class="seat-empty" data-slot="empty-label">Your seat</div></div>
  <!-- Her seat's pick card: "What do you bring to the table?" Any craft (Product first), or her own craft (name tag: name-tag.js); any seat is hers (lib/cast.js) -->
  <aside class="pick-card" id="pick-card" data-component="pick-card" data-state="hidden" hidden>
    <p class="pick-q" data-slot="question">What do you bring to the table?</p>
    <div class="pick-options" data-slot="options">
      <button type="button" class="pick-option" data-pick="product" data-slot="option">Product</button>
      <button type="button" class="pick-option" data-pick="design" data-slot="option">Design</button>
      <button type="button" class="pick-option" data-pick="research" data-slot="option">Research</button>
      <button type="button" class="pick-option" data-pick="engineering" data-slot="option">Engineering</button>
      <button type="button" class="pick-option" data-pick="data" data-slot="option">Data</button>
      <button type="button" class="pick-option" data-pick="strategy" data-slot="option">Strategy</button>
      <button type="button" class="pick-option" data-pick="craft" data-slot="option">Your own craft</button>
    </div>
  </aside>

  <!-- Teammates' small sheets, one in front of each seat -->
  <section class="mini-sheet" data-sheet="design" hidden></section>
  <section class="mini-sheet" data-sheet="data" hidden></section>
  <section class="mini-sheet" data-sheet="research" hidden></section>
  <section class="mini-sheet" data-sheet="strategy" hidden></section>
  <section class="mini-sheet" data-sheet="engineering" hidden></section>

  <!-- Her file card -->
  <section id="file-card" class="file-card" data-component="her-file" data-state="empty" hidden>
    <header class="file-head"><span class="file-name">your file</span><span class="file-path">taste.md</span></header>
    <ol class="file-lines" id="file-lines"></ol>
    <div class="sounds-like" id="sounds-like" hidden></div>
    <div class="file-note" id="file-note"></div>
  </section>

  <!-- Her full-size sheet -->
  <section id="her-sheet" class="her-sheet" hidden>
    <h1 class="her-q">What’s the idea?</h1>
    <p class="her-idea" id="her-idea"></p>
    <div class="her-flow" id="her-flow"></div>
    <div class="her-notes" id="her-notes"></div>
    <form id="her-form" class="her-form" autocomplete="off" data-component="her-idea" data-state="asking">
      <input id="her-input" class="her-input" type="text" spellcheck="false" placeholder="Write the idea">
      <span class="her-hint" id="her-hint">Enter to write it down</span>
    </form>
  </section>

  <!-- Design's grey sketches slide over the table -->
  <section id="sketch-sheet" class="sketch-sheet" hidden>
    <div class="sketch-wait" id="sketch-wait"></div>
    <div class="sketch-inner" id="sketch-inner"></div>
  </section>

  <!-- Counter and meter -->
  <section id="tally" class="tally" data-component="tally" data-state="hidden" hidden>
    <button class="counter" id="counter" type="button">
      <span class="counter-row"><span class="roll" id="came"></span><span class="counter-label">decisions came up</span></span>
      <span class="counter-row"><span class="roll roll-pink" id="brought"></span><span class="counter-label">brought to you</span></span>
    </button>
    <div class="meter" id="meter">
      <div class="meter-label">In your craft</div>
      <div class="meter-num"><span class="roll" id="pct"></span><span class="meter-unit">%</span></div>
      <div class="meter-bar"><span class="meter-craft" id="meter-craft"></span><span class="meter-stamp" id="meter-stamp"></span></div>
      <div class="meter-counts" id="meter-counts"></div>
    </div>
  </section>
</main>
</div>

<script src="vendor/motion/motion.js"></script>
<script src="room.js"></script>
<script src="stage.js"></script>
<script src="replay.js"></script>
<script src="close.js"></script>
<script src="focus-doc.js"></script>
<script src="voice.js"></script>
<script src="flow.js"></script>
<script src="sketches.js"></script>
<script src="first-sketch.js"></script>
<script src="idea-sheet.js"></script>
<script src="team-space.js"></script>
<script src="name-tag.js"></script>
<script>/* polish.css loads last, after any stylesheet the scripts inject */(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="/polish.css";document.head.appendChild(l);
/* ?look=<name> layers public/looks/<name>.css on top (design studio); no ?look, no change */
var k=(new URLSearchParams(location.search).get("look")||"").toLowerCase();if(/^[a-z0-9-]{1,40}$/.test(k)){var m=document.createElement("link");m.rel="stylesheet";m.href="/looks/"+k+".css";document.head.appendChild(m);document.documentElement.setAttribute("data-look",k);}})();</script>
</body>
</html>
