<title>Milestone 2 · the first decision and a quick unblock</title>
<!-- Two stage moments in the room, ink-paper look (DEMO.md stage flow 0:38–1:05; docs/M2-PLAN.md).
     A1 THE FIRST DECISION: Noor's question waits in her inbox; she opens it into her document (the room steps back),
     says who it's really for, sends; the rough journey redraws, and a run of decisions lifts off each owner's spot,
     arcs to the team space and settles there with that teammate's mark, 150 ms apart. No counts, no confetti.
     A2 A QUICK UNBLOCK: an action card, "Bo's blocked: when do orders close?", with the team's suggestion. One big Yes,
     a quiet "Say something else". Yes: the card folds into the team space as a decision with her mark and Bo's, Bo's
     delighted clip plays, the inbox goes back to "Nothing needs you right now". Say something else: her voice
     opens on the card and her words replace the suggestion.
     Act 2 as refined (DEMO.md on po/two-focus): FOCUS 1 (0:38) is Noor's research (the finding is a marked placeholder:
     the rehearsal run's only finding is about baking waste, not who buys); FOCUS 2 (1:08) is Mika's rough journey in
     words, she speaks, Mika replies by the pin, a line is struck and rewritten her way, then her takeaways.
     ?flow=decide | unblock (&say=1) | feel; no flow plays all of Act 2. &step=0..12 &still=1 (0..4 focus 1 and the
     cascade, 5..8 the unblock, 9..12 focus 2).
     Hooks (names from docs/COMPONENTS.md, new ones marked NEW) are listed at the bottom of this file. -->

.thanks b { display: block; font: 500 13px/1 var(--ip-sans); font-style: normal; color: var(--t); margin-bottom: 4px; }
/* a slip of paper in flight */

<script>
(function () {
  const q = new URLSearchParams(location.search), FLOW = q.get('flow'), STEP = q.get('step'), still = q.get('still') === '1', SAY = q.get('say') === '1';
  const instant = still || STEP != null, N = STEP == null ? 99 : +STEP;
  const c = document.getElementById('c'), $ = s => c.querySelector(s), { animate } = Motion;
  const spring = (d = .5) => ({ type: 'spring', visualDuration: d, bounce: 0 });
  const wait = ms => new Promise(r => setTimeout(r, instant ? 0 : ms));
  const A = (el, k, o) => animate(el, k, instant ? { duration: 0 } : o);
  const emit = (name, detail) => document.dispatchEvent(new CustomEvent(name, { detail }));
  const redrawAll = el => { if (el.classList.contains('pane')) InkPaper.redraw(el); el.querySelectorAll('.pane').forEach(InkPaper.redraw); };
  InkPaper.dress(c);

  const WHO = { design: 'mika', research: 'noor', data: 'theo', strategy: 'ines', engineering: 'bo', product: 'her' };
  const NAME = { mika: 'Mika', noor: 'Noor', theo: 'Theo', ines: 'Ines', bo: 'Bo', her: 'Priya' };
  // where each teammate's decision lifts off: their hands on the table, below every face
  const HAND = { mika: [468, 520], noor: [690, 470], theo: [850, 500], ines: [1010, 470], bo: [1117, 520], her: [700, 640] };
  const K = 1600 / 1588, P2 = (x, y) => [(x - 6) * K, y * K];
  const PATCH = { bo: [975, 270, 480], noor: [500, 170, 400], mika: [280, 190, 540] };

  // the rough journey (DEMO.md 0:31–0:38), then its reshape after her answer
  const J0 = { users: [['morning regulars'], ['the weekend pastry crowd'], ['the bakers']], stages: ['choose', 'order', 'pick up'] };
  const J1 = { users: [['the regulars', 'main'], ['the weekend pastry crowd', 'later'], ['the bakers', 'later']], said: '“They come every morning.”', stages: ['their usual', 'held till 10', 'pick up'] };
  function journey(j) {
    $('#fsUsers').innerHTML = j.users.map(([t, k]) => `<span class="fs-user ${k || ''}" data-slot="user">${t}</span>`).join('');
    $('#fsStages').innerHTML = j.stages.map(s => `<b>${s}</b>`).join('<i>→</i>');
    const sd = $('#fsSaid'); if (j.said) { sd.textContent = j.said; sd.classList.remove('hide'); } else sd.classList.add('hide');
    InkPaper.redraw($('#idea'));
  }
  journey(J0);

  // the run of decisions her one answer settles (answer.mapped), each with the teammate who took it
  const RUN = [
    { id: 'usual', seat: 'design', headline: 'Their usual loaf, one tap away' },
    { id: 'hold', seat: 'engineering', headline: 'Held till 10, every morning' },
    { id: 'login', seat: 'engineering', headline: 'No login' },
    { id: 'phone', seat: 'research', headline: 'No phone field' },
    { id: 'count', seat: 'data', headline: 'Tomorrow’s bake, counted from the holds' },
  ];
  function slipHTML(d) {
    const seats = d.seats || [d.seat];
    return `<span class="ts-marks" data-slot="marks">${seats.map(s => `<span class="ts-mark" data-seat="${s}" data-who="${WHO[s]}" title="${NAME[WHO[s]]}">${s === 'product' ? 'P' : ''}</span>`).join('')}</span>` +
      `<span class="ts-headline" data-slot="headline">${d.headline}</span>`;
  }
  // one decision: it lifts off its owner's spot, arcs to the team space and settles there
  async function settle(d, from) {
    const li = document.createElement('li'); li.className = 'ts-card'; li.dataset.joint = d.id; li.dataset.seat = d.seat; li.dataset.who = WHO[(d.seats || [d.seat])[d.seats ? 1 : 0]] || WHO[d.seat];
    if (d.seats && d.seats.includes('product')) li.dataset.her = '';
    li.dataset.state = 'settling'; li.innerHTML = slipHTML(d); $('#tsCards').appendChild(li);
    const ts = $('#ts');
    if (ts.dataset.state === 'empty') {
      // the sheet pins in with its first card: it unrolls down from its top edge, one 300 ms move
      ts.dataset.state = 'shown'; InkPaper.redraw(ts);
      if (!instant) { ts.style.transformOrigin = '50% 0'; animate(ts, { opacity: [0, 1], scaleY: [.55, 1], y: [-10, 0] }, { duration: .3, ease: [.33, 0, .2, 1] }); }
    } else InkPaper.redraw(ts);
    if (instant) { li.dataset.state = 'closed'; return; }
    const r = li.getBoundingClientRect(), cr = c.getBoundingClientRect();
    const x1 = r.left - cr.left, y1 = r.top - cr.top, [hx, hy] = from || HAND[WHO[d.seat]];
    const dx = hx - r.width / 2 - x1, dy = hy - r.height / 2 - y1;
    const mx = dx * .45, my = Math.max(dy, 0) * .45 + 70;   // a soft arc that dips across the tabletop, below every face
    li.style.opacity = 0;
    animate(li, { opacity: [0, 1, 1] }, { duration: .25, times: [0, .6, 1] });
    await animate(li, { x: [dx, mx, 0], y: [dy, my, 0], rotate: [-6, 3, 0], scale: [.86, .95, 1] }, { duration: 1.05, ease: [.45, .05, .3, 1], times: [0, .5, 1] }).finished;
    li.dataset.state = 'closed'; emit('studio:settled', { id: d.id });
  }
  async function cascade(list) {
    emit('answer.mapped', { askId: 'who-for', decisions: list.map(d => ({ id: d.id, choice: d.headline })) });
    const ps = list.map((d, i) => wait(i * 150).then(() => settle(d)));
    await Promise.all(ps);
  }

  const ptr = $('#pointer');
  const at = el => { const r = el.getBoundingClientRect(), cr = c.getBoundingClientRect(); return { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2 }; };
  const tap = async el => { if (instant) return; animate(ptr, { opacity: 1 }, { duration: .2 }); await animate(ptr, { x: at(el).x - 12, y: at(el).y - 12 }, spring(.55)).finished;
    el.classList.add('is-hover'); await wait(120); await animate(ptr, { scale: [1, .8, 1] }, { duration: .26 }).finished; el.classList.remove('is-hover'); };
  const hidePtr = () => { if (!instant) animate(ptr, { opacity: 0 }, { duration: .3 }); };
  const veil = (v, d = .5) => { const vl = $('#veil'); if (instant) vl.style.opacity = v; else animate(vl, { opacity: v }, { duration: d }); document.body.classList.toggle('focus-open', !!v); };
  const pills = () => [...c.querySelectorAll('.canvas > .pill')];
  function trayTo(who, text, opts = {}) {
    const tray = $('#tray'), it = $('#item');
    tray.dataset.who = who; tray.classList.toggle('quiet', !!opts.quiet);
    $('#inbox').dataset.needs = opts.quiet ? 'no' : 'yes';
    if (opts.quiet) { it.removeAttribute('data-ask'); it.removeAttribute('data-seat'); it.removeAttribute('data-action'); }
    else { if (opts.action) { it.removeAttribute('data-ask'); it.dataset.action = opts.action; } else { it.removeAttribute('data-action'); it.dataset.ask = opts.ask; } it.dataset.seat = opts.seat; }
    $('#tWho').textContent = opts.quiet ? 'Your inbox' : text[0]; $('#tQ').textContent = opts.quiet ? 'Nothing needs you right now' : text[1];
    tray.querySelector('.open').textContent = opts.quiet ? '' : 'Open it';
    InkPaper.redraw(tray);
  }
  function playPatch(who, clip, at0) {
    const p = PATCH[who], pt = $('#patch'), v = $('#patchV'), [l, t] = P2(p[0], p[1]), sz = p[2] * K;
    Object.assign(pt.style, { left: l + 'px', top: t + 'px', width: sz + 'px', height: sz + 'px', webkitMaskImage: `url(first-open/cast/mask-${who}.png)`, maskImage: `url(first-open/cast/mask-${who}.png)` });
    v.src = `first-open/cast/${who}-${clip}.webm`; v.play().catch(() => {}); if (instant && at0) setTimeout(() => v.pause(), at0 * 1000);
    A(pt, { opacity: [0, 1] }, { duration: .4 });
  }
  const typeWords = async (box, text, ms = 150) => { box.innerHTML = ''; for (const w of text.split(' ')) { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; box.appendChild(s); if (!instant) { animate(s, { opacity: [0, 1] }, { duration: .22 }); await wait(ms); } } };

  // ================= the focus document: one family with her-page.html (design/loop) =================
  const MIC = '<svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 8a5 5 0 0010 0M8 13v2"/></svg>';
  const LINK = '<svg viewBox="0 0 12 12" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 7l2-2M4.5 3.5l1-1a2.1 2.1 0 013 3l-1 1M7.5 8.5l-1 1a2.1 2.1 0 01-3-3l1-1"/></svg>';
  const roomBits = () => [$('#inbox'), $('#ts'), $('#idea'), ...pills()];
  async function openDoc({ who, seat, doc, from, question, work, askId }) {
    $('#inbox').dataset.state = 'expanded'; emit('focus.open', { askId });
    veil(1, .5); A(roomBits(), { opacity: 0 }, { duration: .35 });   // only her and the work while she answers
    const fd = document.createElement('section'); fd.className = 'abs doc fdoc'; fd.id = 'focus-doc'; fd.dataset.who = who;
    Object.assign(fd.dataset, { seat, doc, component: 'focus-doc', state: 'asking' });
    fd.innerHTML = `<div class="head"><div><div class="from fd-by" data-slot="by" data-who="${who}"><i></i>${from}</div><h2 class="fd-question" data-slot="question">${question}</h2></div></div>
      <div class="fd-work" data-slot="work" data-kind="${doc}"><span class="cap">The work</span><div class="stage">${work}</div></div>
      <div class="fd-side"><div class="take" data-who="her"><span class="lab">Your thoughts</span>
        <div class="fd-said" data-slot="said" data-state="speaking"><span class="fd-words" data-slot="words"></span></div>
        <div class="fd-input" data-slot="input"><button class="fd-mic" id="fmic" aria-label="Hold to talk">${MIC}</button><span class="hint" id="fhint">Hold to talk</span>
          <button class="btn fd-send" data-slot="send" id="send">Send</button></div></div></div>`;
    c.appendChild(fd); InkPaper.dress(fd); redrawAll(fd);
    if (!instant) animate(fd, { opacity: [0, 1], y: [14, 0], scale: [.985, 1] }, spring(.4));   // never an empty sheet

  async function speak(fd, words, ms = 165) {
    fd.dataset.state = 'speaking'; $('#fhint').textContent = 'Listening… take your time';
    const mic = $('#fmic'), pulse = !instant && setInterval(() => mic.style.scale = (1 + Math.random() * .1).toFixed(3), 120);
    await typeWords(fd.querySelector('.fd-words'), words, ms);

  }
  function closeDocInstant(fd) { fd.remove(); veil(0, .5); $('#inbox').dataset.state = 'collapsed'; A(roomBits(), { opacity: 1 }, { duration: .4 }); }
  const typeInto = async (el, text, ms = 30) => { if (instant) { el.textContent = text; return; } for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await wait(ms); } };
  function pinOn(fd, anchor, who, seat, dx = 0, xEl = anchor) {
    const w = fd.querySelector('.fd-work'), wr = w.getBoundingClientRect(), ar = anchor.getBoundingClientRect(), xr = xEl.getBoundingClientRect();
    const p = document.createElement('div'); p.className = 'fd-pin'; p.dataset.who = who; p.dataset.seat = seat;
    p.innerHTML = `<span>${who === 'her' ? 'P' : NAME[who][0]}</span>`;
    p.style.left = (xr.right - wr.left + 22 + dx) + 'px'; p.style.top = (ar.top - wr.top + 16) + 'px'; w.appendChild(p);
    if (!instant) animate(p, { scale: [.4, 1], opacity: [0, 1] }, spring(.4));
    return p;
  }

  // ================= FOCUS 1 (0:38): who it's for, on Noor's research =================
  // The finding is a marked placeholder: the rehearsal run's only finding is about baking waste, not who buys.
  const FINDING = `<div class="finding ff" data-slot="finding"><div class="lab2"><span>Noor’s finding</span><span class="prep ff-prepared" data-slot="prepared">researched before the demo</span></div>
      <div class="big ff-claim" data-slot="claim"><span class="ph">[Noor’s finding, from the run]</span></div>
      <div class="by ff-about" data-slot="about">Who buys from small neighbourhood bakeries, and when.</div>
      <a class="src ff-src" data-slot="source" href="#">${LINK}<b class="ff-src-title ph" style="font-weight:500">[source]</b><span>· <span class="ff-src-site ph">[site]</span></span></a></div>`;
  async function decide(base = 0) {
    trayTo('noor', ['Noor', 'Who do we build this for first?'], { ask: 'who-for', seat: 'research' });
    if (N < base + 1) return;
    await wait(1200); await tap($('#tray')); hidePtr();
    const fd = await openDoc({ who: 'noor', seat: 'research', doc: 'finding', askId: 'who-for', from: 'From Noor · who buys from small neighbourhood bakeries',
      question: 'Who do we build this for first?', work: FINDING });
    if (N < base + 2) return;
    await wait(1600);   // a beat to read the research
    await speak(fd, 'The regulars. They come every morning, and they hate it when the sourdough’s gone by nine.');
    if (N < base + 3) return;
    await wait(700); await tap($('#send')); hidePtr();
    emit('answer', { askId: 'who-for', text: fd.querySelector('.fd-words').textContent });
    // the document folds down onto the journey; the room comes back
    fd.dataset.state = 'answered';
    if (!instant) { const ir = $('#idea').getBoundingClientRect(), fr = fd.getBoundingClientRect();
      fd.style.transformOrigin = '50% 50%';
      await animate(fd, { scale: [1, .2], x: [0, ir.left + ir.width / 2 - (fr.left + fr.width / 2)], y: [0, ir.top + ir.height / 2 - (fr.top + fr.height / 2)], opacity: [1, 1, 0] }, { duration: .6, ease: [.5, 0, .3, 1], times: [0, .7, 1] }).finished; }
    closeDocInstant(fd); emit('focus.close', { askId: 'who-for' }); trayTo('her', [], { quiet: true });
    // the journey redraws around the regulars
    await wait(250);
    const idea = $('#idea'); idea.dataset.state = 'reshaped'; $('#fs').dataset.state = 'reshaping';
    if (!instant) await animate(idea.querySelector('.fs-bar'), { opacity: [1, 0] }, { duration: .2 }).finished;
    journey(J1); if (!instant) { const ln = idea.querySelector(':scope > .ol .ln'); if (ln) animate(ln, { strokeDashoffset: [1, 0] }, { duration: .7, ease: [.45, .05, .25, 1] }); animate(idea.querySelector('.fs-bar'), { opacity: [0, 1] }, { duration: .35 }); }   // the ink redraws round it, never a blank sheet
    $('#fs').dataset.state = 'drawn';
    if (N < base + 4) return;
    await wait(650);
    await cascade(RUN);   // then a run of decisions settles, each with the teammate who took it
  }

  // ================= FOCUS 2 (1:08): the customer experience, on Mika's rough journey in words =================
  const STEPS = [
    ['7:02', 'Ana opens it on the bus. Her usual sourdough is already there.'],
    ['7:03', 'She types her name and phone number, then picks a time.'],
    ['8:40', 'At the counter, it’s waiting with her name on it.'],
    ['9:15', 'The sourdough’s gone by nine. Hers was held.'],
  ];
  const JW = `<div class="jw" data-slot="journey-words"><div class="lab2">Mika’s rough journey · a regular’s morning, in words</div>
      <ol class="jw-steps"><span class="jw-rail"></span>${STEPS.map(([t, x], i) => `<li class="jw-step" data-step="${i + 1}" data-state="draft"><span class="mk"></span><span><span class="jw-time">${t}</span><span class="jw-text">${x}<s></s></span></span></li>`).join('')}</ol></div>`;
  async function focus2(base = 9) {
    if (instant || base === 0) { journey(J1); fill(); $('#ts').dataset.state = 'shown'; if (!$('#tsCards [data-joint="orders-close"]')) { const li = document.createElement('li'); li.className = 'ts-card'; li.dataset.joint = 'orders-close'; li.dataset.seat = 'engineering'; li.dataset.who = 'bo'; li.dataset.her = ''; li.dataset.state = 'closed'; li.innerHTML = slipHTML({ seats: ['product', 'engineering'], headline: 'Orders close 8pm the night before' }); $('#tsCards').appendChild(li); } trayTo('her', [], { quiet: true }); InkPaper.redraw($('#ts')); }
    trayTo('mika', ['Mika', 'What should this feel like for a regular?'], { ask: 'feel', seat: 'design' });
    if (!instant) { await wait(400); animate($('#tray'), { y: [0, -8, 0] }, { duration: 1, ease: [.33, 0, .2, 1] }); await wait(1300); await tap($('#tray')); hidePtr(); }
    const fd = await openDoc({ who: 'mika', seat: 'design', doc: 'journey-words', askId: 'feel', from: 'From Mika · a regular’s morning, before any screens',
      question: 'What should this feel like for a regular?', work: JW });
    if (N < base + 1) return;
    await wait(2200);   // a beat to read the morning
    await speak(fd, 'Like being known. Like the baker remembers you. Never ask me for anything you could remember.', 150);
    if (N < base + 2) return;
    await wait(700); await tap($('#send')); hidePtr();
    emit('answer', { askId: 'feel', text: fd.querySelector('.fd-words').textContent });
    fd.dataset.state = 'answered'; $('#send').classList.add('hide'); $('#fhint').textContent = 'Sent. Ready for your next thought.';
    A(fd.querySelector('.fd-said'), { opacity: [1, .9] }, { duration: .4 });
    // her words go quiet in her column; her pin lands on the line it's about; Mika answers briefly by the pin
    const step = fd.querySelector('.jw-step[data-step="2"]'), txt = step.querySelector('.jw-text');
    const card = fd.querySelector('.jw'); pinOn(fd, txt, 'her', 'product', -190, card);
    await wait(500);
    const mp = pinOn(fd, txt, 'mika', 'design', -156, card);
    const w = fd.querySelector('.fd-work'), wr = w.getBoundingClientRect(), pr = mp.getBoundingClientRect();
    const rp = document.createElement('div'); rp.className = 'fd-reply'; rp.dataset.seat = 'design';
    rp.innerHTML = '<div class="bubble" data-who="mika"><b>Mika</b>Then nothing to fill in. One tap, and it’s hers.</div>';
    rp.style.left = (pr.left - wr.left - 74) + 'px'; rp.style.top = (pr.bottom - wr.top + 12) + 'px'; w.appendChild(rp); InkPaper.dress(rp); redrawAll(rp);
    if (!instant) InkPaper.lay(rp.querySelector('.bubble'));
    emit('chime', { by: 'Mika', seat: 'design', text: 'Then nothing to fill in. One tap, and it’s hers.' });
    // the line is struck and rewritten in her direction, in front of her
    await wait(900);
    step.dataset.state = 'struck';
    if (!instant) await animate(txt.querySelector('s'), { transform: ['scaleX(0)', 'scaleX(1)'] }, { duration: .5, ease: [.45, .05, .3, 1] }).finished;
    const nw = document.createElement('span'); nw.className = 'jw-new'; nw.dataset.slot = 'rewrite'; txt.after(nw); step.dataset.state = 'rewritten';
    await typeInto(nw, 'One tap. Nothing to fill in: we remember her.', 30); redrawAll(fd);
    if (N < base + 3) return;
    // the reply lingers long enough to read, then folds into its pin

    if (!instant) { const pb = mp.getBoundingClientRect(), db = rp.getBoundingClientRect(); await animate(rp, { scale: [1, .08], x: [0, pb.left - db.left - 6], y: [0, pb.top - db.top - 6], opacity: [1, 0] }, spring(.5)).finished; }
    rp.remove();
    // her takeaways, in her voice
    const br = document.createElement('div'); br.className = 'take fd-brief'; br.dataset.who = 'her'; br.dataset.state = 'shown'; br.dataset.component = 'takeaways';

    fd.querySelector('.fd-side').appendChild(br); InkPaper.dress(br); redrawAll(br); if (!instant) InkPaper.lay(br);

  }

  // ================= A2: a quick unblock =================
  // a still or a single beat starts with the first decision's cards already in the team space
  function fill() {
    if ($('#tsCards').children.length) return; $('#ts').dataset.state = 'shown';
    RUN.forEach(d => { const li = document.createElement('li'); li.className = 'ts-card'; li.dataset.joint = d.id; li.dataset.seat = d.seat; li.dataset.who = WHO[d.seat]; li.dataset.state = 'closed'; li.innerHTML = slipHTML(d); $('#tsCards').appendChild(li); });
    InkPaper.redraw($('#ts'));
  }
  async function unblock(base = 5, fresh = false) {
    if (instant || fresh) { journey(J1); fill(); }
    trayTo('bo', ['Bo’s blocked', 'When do orders close?'], { action: 'orders-close', seat: 'engineering' });
    if (!instant) { animate($('#tray'), { y: [0, -8, 0] }, { duration: 1, ease: [.33, 0, .2, 1] }); }
    if (N < base + 1) return;
    await wait(1100); await tap($('#tray')); hidePtr();
    // the action card grows up out of the inbox
    $('#inbox').dataset.state = 'expanded';
    const ac = document.createElement('article'); ac.className = 'abs card inbox-action'; ac.id = 'action'; ac.dataset.who = 'bo';
    Object.assign(ac.dataset, { component: 'inbox-action', action: 'orders-close', seat: 'engineering', state: 'asking' });
    ac.innerHTML = `<div class="ia-who" data-slot="who"><span class="ia-face"><video muted playsinline autoplay loop src="first-open/cast/bo-idle.webm"></video></span>
        <span><b>Bo’s blocked</b><small>He’s building the order form</small></span></div>
      <div class="ia-q" data-slot="question">When do orders close?</div>
      <div class="ia-sug" id="sug" data-slot="suggestion"><span class="k">We suggest</span><p id="sugP">8pm the night before</p></div>
      <div class="ia-row"><button class="btn ia-yes" data-slot="yes" id="yes">Yes</button>
        <button class="mic ia-else" data-slot="say" id="else"><span class="ring"><svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 8a5 5 0 0010 0M8 13v2"/></svg></span><span id="elseT">Say something else</span></button></div>`;
    c.appendChild(ac); InkPaper.dress(ac); redrawAll(ac);
    animate($('#tray'), { opacity: instant ? .0 : [1, 0] }, { duration: instant ? 0 : .25 });
    if (!instant) { ac.style.transformOrigin = '50% 100%'; animate(ac, { scaleY: [.35, 1], opacity: [0, 1] }, spring(.45)); }
    emit('owner.action', { id: 'orders-close', seat: 'engineering', by: 'Bo', question: 'When do orders close?', suggestion: '8pm the night before' });
    if (N < base + 2) return;
    let choice = '8pm the night before', headline = 'Orders close 8pm the night before';
    if (SAY) {
      // her own words instead: the voice opens on the card and replaces the suggestion
      await wait(1100); await tap($('#else')); hidePtr();
      ac.dataset.state = 'speaking'; $('#elseT').textContent = 'Listening…';
      const sug = $('#sug'); sug.classList.add('hers'); sug.innerHTML = '<span class="k">You said</span><p id="sugP"></p><span class="was">8pm the night before</span>';
      const ring = $('#else .ring'), pulse = !instant && setInterval(() => ring.style.scale = (1 + Math.random() * .12).toFixed(3), 120);
      await typeWords($('#sugP'), 'Seven the night before. We start baking at four.', 170);
      if (pulse) clearInterval(pulse); ring.style.scale = ''; $('#elseT').textContent = 'Say it again';
      choice = 'Seven the night before. We start baking at four.'; headline = 'Orders close 7pm the night before';
      emit('action.say', { id: 'orders-close', text: choice }); InkPaper.redraw(ac);
      if (N < base + 3) return;
      await wait(900);
    } else { if (N < base + 3) { $('#yes').classList.add('is-hover'); return; } await wait(1300); }
    await tap($('#yes')); hidePtr();
    ac.dataset.state = 'yes'; emit('action.yes', { id: 'orders-close', choice });
    // the card folds into the team space as a decision with her mark and Bo's
    const d = { id: 'orders-close', seat: 'engineering', seats: ['product', 'engineering'], headline };
    const r = ac.getBoundingClientRect(), cr = c.getBoundingClientRect();
    if (!instant) { ac.style.transformOrigin = '50% 50%'; await animate(ac, { scaleY: [1, .14], scaleX: [1, .7], opacity: [1, .0] }, { duration: .4, ease: [.5, 0, .5, 1] }).finished; }
    ac.remove(); $('#inbox').dataset.state = 'collapsed';
    trayTo('her', [], { quiet: true }); A($('#tray'), { opacity: [0, 1] }, { duration: .4 });
    const fly = settle(d, [r.left - cr.left + r.width / 2, r.top - cr.top + r.height / 2 + 60]);
    // Bo carries on: his delighted moment, one short line, then back to work
    playPatch('bo', 'delighted', 2.5);
    const th = document.createElement('div'); th.className = 'abs card thanks'; th.dataset.who = 'bo';
    th.innerHTML = '<b>Bo</b>Got it. Carrying on.'; c.appendChild(th); InkPaper.dress(th); InkPaper.redraw(th); if (!instant) InkPaper.lay(th, .4);
    await fly;
    if (instant) return;
    await wait(3600); animate(th, { opacity: 0 }, { duration: .8 }); animate('#patch', { opacity: 0 }, { duration: 1.2 });
  }

  (async () => {
    await document.fonts.ready; InkPaper.redraw($('#ts')); InkPaper.redraw($('#idea'));
    if (FLOW === 'unblock') { await unblock(0, true); return; }
    if (FLOW === 'decide') { await decide(0); return; }
    if (FLOW === 'feel') { await focus2(0); return; }
    // all of Act 2, as on stage: 0..4 focus 1 and the cascade, 5..8 the unblock, 9..12 focus 2
    if (instant) { if (N <= 4) await decide(0); else if (N <= 8) await unblock(5); else await focus2(9); return; }
    await decide(0); await wait(1600); await unblock(5); await wait(1200); await focus2(9);
  })();
})();
</script>
<!-- HOOKS for the build (docs/COMPONENTS.md names; NEW = proposed here)
  inbox            aside#inbox.inbox[data-component=inbox] data-state collapsed·expanded, data-needs yes·no
  inbox-item       .inbox-item[data-ask][data-seat] (a question) — NEW: .inbox-item[data-action][data-seat] (an action card waiting)
  focus-doc        section#focus-doc.focus-doc (here .fdoc, one family with her-page.html) [data-seat] data-state asking·speaking·answered
                   NEW data-doc = finding | journey-words (also on the work: .fd-work[data-kind], adding the kind "journey-words")
                   slots: by (.fd-by), question (.fd-question), work (.fd-work), words (.fd-words in .fd-said[data-state speaking·landed]), input (.fd-input), send (.fd-send)
                   body.focus-open while it's open (the room blurs; team space, journey sheet, pills and inbox step out of view)
  NEW finding      .finding.ff > .ff-prepared ("researched before the demo"), .ff-claim, .ff-about, a.ff-src > .ff-src-title + .ff-src-site
  NEW journey-words .jw > ol.jw-steps > li.jw-step[data-step] data-state draft·struck·rewritten > .jw-time, .jw-text (> s, the strike), .jw-new (her direction, rewritten)
  NEW pins/replies .fd-pin[data-seat] on the work (product = her "P"); .fd-reply[data-seat] > .bubble[data-who]: lingers ~3 s, folds into its pin (on chime)
