<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>Her focus · the margin becomes the minutes</title>
<link rel="stylesheet" href="../ink-paper.css">
<!-- Round 2 of the engagement loop. One focus layout: the artifact always in view (left), the meeting thread as the
     record (right), rounds that fold, and a write-up that grows from the conversation.
     ?v=minutes&w=mika|noor&s=0..5   the main take (Mika's wireframes: rich anchors; Noor's finding: few anchors)
     ?v=tabs&tab=work|conv|write     the second take: tabs on the sheet
     ?v=room                         back in the room, the meeting kept as notes
     &play=1                         the flow
     Round 1 copy is from DEMO.md. Round 2, and her note and the takeaways for Noor's finding, are sketch copy (DEMO.md has none). -->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #2B1F17; }
.canvas { position: relative; width: 1600px; height: 900px; overflow: hidden; }
.room { position: absolute; inset: 0; background: url(her-seat/painting.jpg) center top / 1600px 893px no-repeat, #6E4B33; }
.veil { position: absolute; inset: 0; background: rgba(43,31,23,.18); backdrop-filter: blur(3px); }
.canvas .abs, .canvas .pill { position: absolute; }
.hide { display: none !important; }
.ghost { opacity: 0; }
.label { font: 500 13px/1.2 var(--ip-sans); color: var(--ip-ink-3); }
.tag.replay { right: 20px; top: 18px; z-index: 9; }

/* ---------- the focus sheet ---------- */
.doc { left: 48px; top: 28px; width: 1504px; height: 844px; z-index: 5; }
.head { position: absolute; left: 44px; right: 44px; top: 30px; display: flex; align-items: flex-start; gap: 24px; }
.head .from { display: flex; align-items: center; gap: 8px; font: 500 14px/1 var(--ip-sans); color: var(--t); }
.head .from i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.head .q { margin-top: 8px; font: 400 30px/1.18 var(--ip-serif); letter-spacing: -.01em; }
.head .acts { margin-left: auto; display: flex; gap: 10px; flex: none; }

/* left: the artifact, always in view */
.art { position: absolute; left: 44px; top: 130px; width: 900px; bottom: 30px; border-radius: 30px; background: rgba(255,255,255,.55);
  box-shadow: inset 0 0 0 1px rgba(84,58,38,.13); }
.art .cap { position: absolute; left: 22px; top: 18px; display: flex; gap: 10px; align-items: center; }
.art .cap .changed { font: italic 400 15px/1 var(--ip-serif); color: var(--ip-ink-2); }
.art .stage { position: absolute; inset: 0; display: grid; place-items: center; }

/* Mika's wireframes */
.art .stage .wire { zoom: 1.16; }
.wire { position: relative; width: 380px; padding: 18px; border-radius: 28px; background: #F1ECE4; box-shadow: inset 0 0 0 1.5px rgba(84,58,38,.22); font: 400 15px/1.2 var(--ip-sans); color: #5B5048; }
.wire .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font: 500 16px/1 var(--ip-serif); color: #4A4038; }
.wire .bar i { width: 30px; height: 9px; border-radius: 5px; background: #D4CCC1; }
.wire .usual { padding: 14px; border-radius: 18px; background: #E4DDD2; margin-bottom: 10px; }
.wire .usual small { display: block; font-size: 13px; color: #6B5F55; margin-bottom: 4px; }
.wire .usual .b { margin-top: 10px; height: 34px; border-radius: 17px; background: #CFC6BA; display: grid; place-items: center; font-size: 14px; color: #4A4038; }
.wire .weekly { display: flex; align-items: center; gap: 8px; padding: 0 4px 12px 6px; font-size: 14px; color: #5B5048; overflow: hidden; }
.wire .weekly i { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px #8E8378; }
.wire .f { position: relative; height: 40px; margin-bottom: 9px; padding: 0 13px; display: flex; align-items: center; border-radius: 13px; background: #FBF8F3; box-shadow: inset 0 0 0 1px #D9D1C6; font-size: 14px; color: #6B5F55; }
.wire .f s { position: absolute; left: 7px; right: 7px; top: 50%; height: 2.2px; background: var(--ip-mika-t); border-radius: 2px; transform-origin: left; transform: scaleX(0); transition: transform .7s var(--ip-land); }
.wire .f.cut s { transform: scaleX(1); } .wire .f.cut { color: #A79B90; }
.wire .go { height: 42px; border-radius: 21px; background: #8E8378; color: #fff; display: grid; place-items: center; font: 500 15px/1 var(--ip-sans); margin-top: 4px; }

/* Noor's finding */
.finding { width: 640px; padding: 30px 34px; border-radius: 28px; background: rgba(255,255,255,.8); box-shadow: inset 0 0 0 1px rgba(84,58,38,.14); }
.finding .big { position: relative; display: inline; font: 400 34px/1.25 var(--ip-serif); }
.finding .by { margin-top: 16px; font: italic 400 18px/1.4 var(--ip-serif); color: var(--ip-ink-2); }
.finding .src { display: flex; gap: 10px; margin-top: 20px; }
.finding .src a { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(201,94,56,.1); color: var(--ip-noor-t); font: 500 14px/1 var(--ip-sans); text-decoration: none; }
.finding .src svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.finding .held { margin-top: 22px; padding: 12px 16px; border-radius: 16px; background: rgba(226,184,58,.16); box-shadow: inset 0 0 0 1px rgba(99,74,8,.25); font: 400 18px/1.35 var(--ip-serif); color: var(--ip-ink); }
.finding .held b { display: block; font: 500 13px/1 var(--ip-sans); color: var(--ip-bo-t); margin-bottom: 4px; }

/* pins: every note leaves one on the part it's about, in the author's crayon */
.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50% 50% 50% 4px; rotate: -45deg; background: var(--c); z-index: 3;
  box-shadow: 0 0 0 2px var(--ip-paper), 1px 2px 3px rgba(60,35,15,.35); display: grid; place-items: center; transition: transform .4s var(--ip-land), box-shadow .3s; }
.pin span { rotate: 45deg; font: 600 12px/1 var(--ip-sans); color: #fff; }
.pin[data-who="bo"] span, .pin[data-who="ines"] span { color: #2A1F12; }
.pin.quiet { transform: scale(.42); } .pin.quiet span { opacity: 0; }
.pin.lit { transform: scale(1.25); box-shadow: 0 0 0 3px var(--ip-paper), 0 0 0 7px color-mix(in srgb, var(--c) 35%, transparent), 1px 2px 3px rgba(60,35,15,.35); }

/* right: the meeting thread, the record */
.minutes { position: absolute; left: 976px; right: 44px; top: 130px; bottom: 30px; display: flex; flex-direction: column; gap: 12px; }
.minutes .mh { display: flex; justify-content: space-between; align-items: baseline; }
.round { display: flex; flex-direction: column; gap: 8px; }
.round .rh { display: flex; align-items: center; gap: 8px; font: 500 13px/1 var(--ip-sans); color: var(--ip-ink-3); }
.round .rh::after { content: ''; flex: 1; height: 1px; background: var(--ip-rule); }
.round.folded .entries { display: none; }
.round .sum { display: none; padding: 10px 14px; border-radius: 16px; background: rgba(84,58,38,.06); font: italic 400 16px/1.35 var(--ip-serif); color: var(--ip-ink-2); }
.round.folded .sum { display: flex; gap: 10px; align-items: center; }
.round .sum .dots { display: inline-flex; flex: none; } .round .sum .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: -3px; box-shadow: 0 0 0 1.5px var(--ip-paper-deep); }
.round .sum .open { margin-left: auto; font: 500 13px/1 var(--ip-sans); font-style: normal; color: var(--ip-ink-2); flex: none; }
.entries { display: flex; flex-direction: column; gap: 6px; }
.e { position: relative; margin-left: calc(var(--d, 0) * 20px); padding: 9px 13px 10px; border-radius: 16px; background: rgba(255,255,255,.66); box-shadow: inset 0 0 0 1px rgba(84,58,38,.1); transition: box-shadow .3s; }
.e[data-d="1"] { --d: 1; } .e[data-d="2"] { --d: 2; } .e[data-d="3"] { --d: 3; }
.e::before { content: ''; position: absolute; left: -12px; top: -6px; width: 9px; height: 26px; border-left: 1.5px solid rgba(74,48,32,.35); border-bottom: 1.5px solid rgba(74,48,32,.35); border-bottom-left-radius: 8px; }
.e[data-d="0"]::before { display: none; }
.e b { display: flex; align-items: center; gap: 6px; font: 500 13px/1 var(--ip-sans); color: var(--t); margin-bottom: 4px; }
.e b i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.e p { margin: 0; font: italic 400 17px/1.36 var(--ip-serif); }
.e.hers { background: var(--ip-paper-her); box-shadow: inset 0 0 0 1px rgba(212,114,136,.4); }
.e.hers p { font-style: normal; }
.e .did { display: block; margin-top: 4px; font: 500 13px/1.2 var(--ip-sans); color: var(--ip-ink-3); }
.e.lit { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 60%, transparent), 0 2px 8px -2px rgba(60,35,15,.3); }

/* her turn: the slot the voice designer fills (speaking live, the tidy-up) */
.turn { margin-top: auto; padding: 12px 14px; border-radius: 22px; background: rgba(255,255,255,.5); box-shadow: inset 0 0 0 1.5px rgba(212,114,136,.5); display: flex; align-items: center; gap: 12px; }
.turn .t { font: italic 400 17px/1.3 var(--ip-serif); color: var(--ip-ink-2); }
.turn .mic { margin-left: auto; width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--ip-her-t); display: grid; place-items: center; }
.turn .mic svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.turn.speaking { box-shadow: inset 0 0 0 2px var(--ip-her); background: rgba(252,235,239,.8); }
.turn.speaking .t { color: var(--ip-ink); font-style: normal; }
.turn .wave { display: none; gap: 3px; align-items: center; height: 18px; } .turn.speaking .wave { display: inline-flex; }
.turn .wave i { width: 3px; height: 6px; border-radius: 2px; background: var(--ip-her-t); animation: w 1s ease-in-out infinite; }
.turn .wave i:nth-child(2) { animation-delay: -.3s; } .turn .wave i:nth-child(3) { animation-delay: -.6s; } .turn .wave i:nth-child(4) { animation-delay: -.15s; }
@keyframes w { 50% { height: 18px; } }

/* the write-up, growing from the conversation */
.take { flex: none; }
.take .lab { display: flex; justify-content: space-between; }
.take p { margin: 6px 0 0; font: 400 16px/1.38 var(--ip-serif); }
.take p b { display: block; font: 500 13px/1 var(--ip-sans); color: var(--ip-her-t); margin-bottom: 2px; }
.take .reword { display: inline-flex; gap: 5px; align-items: center; font: 500 13px/1 var(--ip-sans); color: var(--ip-her-t); }
.take .reword svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.take .new { background: rgba(212,114,136,.16); border-radius: 4px; }

/* ---------- take two: tabs on the sheet ---------- */
.v-tabs .sheettabs { position: absolute; left: 50%; top: 120px; translate: -50% 0; z-index: 2; }
.v-tabs .sheettabs .tabs span { padding: 9px 20px; font-size: 15px; }
.v-tabs .art { left: 44px; right: 44px; width: auto; top: 176px; bottom: 112px; }
.v-tabs .pinned { position: absolute; width: 300px; z-index: 4; }
.v-tabs .pinned .e { margin-left: 0; } .v-tabs .pinned .e::before { display: none; }
.v-tabs .voicebar { position: absolute; left: 50%; bottom: 30px; translate: -50% 0; width: 720px; }
.v-tabs .conv { position: absolute; left: 44px; right: 44px; top: 176px; bottom: 112px; display: grid; grid-template-columns: 1fr 300px; gap: 36px; }
.v-tabs .conv .threadcol { overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding-right: 8px; }
.v-tabs .conv .mini { border-radius: 24px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(84,58,38,.13); position: relative; overflow: hidden; height: 360px; }
.v-tabs .conv .mini .wire { transform: scale(.62); transform-origin: 0 0; position: absolute; left: 32px; top: 34px; }
.v-tabs .write { position: absolute; left: 44px; right: 44px; top: 176px; bottom: 112px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.v-tabs .write .take p { font-size: 20px; line-height: 1.4; margin-top: 10px; }
.v-tabs .write .changes { display: flex; flex-direction: column; gap: 8px; }
.v-tabs .write .ch { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.6); font: 400 17px/1.35 var(--ip-serif); }
.v-tabs .write .ch i { width: 12px; height: 12px; margin-top: 6px; border-radius: 50%; background: var(--c); flex: none; }

/* ---------- back in the room ---------- */
.v-room .sheet.table { left: 638px; top: 500px; width: 380px; rotate: -1.2deg; padding: 14px 16px; z-index: 2; }
.v-room .sheet.table h3 { font-size: 18px; margin: 3px 0 9px; }
.v-room .sheet.table .steps { margin: 0; } .v-room .sheet.table .step { font-size: 13px; padding: 6px 9px; }
.canvas .sheet.table, .canvas .mnotes, .canvas #roomParts .bubble { position: absolute; }
.v-room .mnotes { left: 880px; top: 680px; rotate: 3deg; z-index: 3; width: 210px; padding: 10px 13px 11px; font-size: 15px; line-height: 1.3; }
.v-room .mnotes .lab { color: var(--ip-her-t); }
</style>
</head>
<body>
<div class="canvas ink-paper" id="c">
  <div class="room"></div>
  <button class="pill" data-who="mika" style="left:420px;top:306px" id="pMika"><span class="dot"></span>Mika<span class="agent">agent</span></button>
  <button class="pill" data-who="noor" style="left:612px;top:250px"><span class="dot"></span>Noor<span class="agent">agent</span></button>
  <button class="pill" data-who="theo" style="left:790px;top:300px"><span class="dot"></span>Theo<span class="agent">agent</span></button>
  <button class="pill" data-who="ines" style="left:1056px;top:226px"><span class="dot"></span>Ines<span class="agent">agent</span></button>
  <button class="pill" data-who="bo" style="left:1150px;top:362px"><span class="dot"></span>Bo<span class="agent">agent</span></button>
  <button class="pill is-her" data-who="her" style="left:590px;top:682px"><span class="dot">P</span><span class="nm">Priya</span><span class="agent">the Customer Whisperer</span></button>
  <div id="roomParts"></div>
  <div class="veil" id="veil"></div>
  <div class="abs doc" id="doc"></div>
  <div class="abs tag replay"><span>Replay</span><small>recorded run</small></div>
</div>

<script src="../../vendor/motion/motion.js"></script>
<script src="../ink-paper.js"></script>
<script>
const q = new URLSearchParams(location.search);
const V = q.get('v') || 'minutes', W = q.get('w') || 'mika', S = q.has('s') ? +q.get('s') : null, TAB = q.get('tab') || 'work', PLAY = q.get('play') === '1';
const c = document.getElementById('c'); c.classList.add('v-' + V);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const { animate } = Motion; const spring = (d = .5) => ({ type: 'spring', visualDuration: d, bounce: 0 });
const NAME = { her: 'You', mika: 'Mika', noor: 'Noor', theo: 'Theo', ines: 'Ines', bo: 'Bo' };
const MIC = '<svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 8a5 5 0 0010 0M8 13v2"/></svg>';
const LINK = '<svg viewBox="0 0 12 12"><path d="M5 7l2-2M4.5 3.5l1-1a2.1 2.1 0 013 3l-1 1M7.5 8.5l-1 1a2.1 2.1 0 01-3-3l1-1"/></svg>';
const PEN = '<svg viewBox="0 0 14 14"><path d="M2 12l1-3 7-7 2 2-7 7z"/></svg>';

// ---------- the two meetings ----------
// each entry: who, depth in the thread (who it builds on), the part of the work it's about, what it did to the work
const WORK = {
  mika: {
    from: 'From Mika · grey wireframes of ordering', q: 'If ordering could feel like one thing, what should it feel like?',
    art: `<div class="wire" id="wire"><div class="bar">Morning loaves<i></i></div>
      <div class="usual" data-a="usual"><small>Your usual</small>Sourdough, sliced<div class="b">Order again</div></div>
      <div class="weekly" data-a="weekly" id="weekly" style="height:0;padding-bottom:0"><i></i>Every Monday? Set it up once</div>
      <div class="f" data-a="name">Name<s></s></div><div class="f" data-a="phone">Phone<s></s></div><div class="f" data-a="login">Sign in or make an account<s></s></div>
      <div class="f" data-a="time">Pick-up time</div><div class="go" data-a="go">Place order</div></div>`,
    rounds: [
      { sum: 'Phone field cut, no logins, a weekly order idea', entries: [
        { who: 'her', d: 0, a: 'usual', t: 'Like the baker already knows you. Don’t ask for anything you already know.' },
        { who: 'mika', d: 1, a: 'phone', t: 'Then the phone field goes, and so does every question we can remember.', did: 'Crossed out the phone field', fx: () => cut('phone') },
        { who: 'bo', d: 2, a: 'login', t: 'Then no logins. I’ll remember them.', did: 'Took out sign-in', fx: () => cut('login') },
        { who: 'ines', d: 1, a: 'usual', t: 'Hmm, regulars might want a standing weekly order. Show that first?' } ] },
      { sum: 'Weekly order, offered quietly under their usual', entries: [
        { who: 'her', d: 0, a: 'usual', t: 'Yes to weekly, but quietly. Their usual loaf stays the first thing they see.' },
        { who: 'ines', d: 1, a: 'weekly', t: 'Agreed. Weekly sits under their usual, one tap to set up.', did: 'Added a weekly line', fx: () => weekly() },
        { who: 'mika', d: 2, a: 'weekly', t: 'I’ll keep it a small line, not a second button.' } ] } ],
    take: { believe: ['Ordering should feel like being known. Never ask for what we could remember.'],
            guide: [['Their usual loaf first, cut every field we already know.'], ['Offer a weekly order quietly, under their usual.']] },
  },
  noor: {
    from: 'From Noor · what sells out first', q: 'What sells out first, and what should we do about it?',
    art: `<div class="finding" id="finding"><span class="label">Noor’s finding</span><div style="margin-top:8px;padding-right:30px" data-a="f1"><span class="big">Sourdough and morning buns go before 9am.</span></div>
      <div class="by">From two baker interviews and a bakery forum thread.</div>
      <div class="src"><a href="#" data-a="s1">${LINK}Baker interviews</a><a href="#" data-a="s2">${LINK}Bakery forum thread</a></div>
      <div class="held hide" id="held" data-a="held"><b>Bo, now</b>Their usual loaf is held for them till ten.</div></div>`,
    rounds: [
      { sum: 'Hold their usual till ten, say plainly what’s left', entries: [
        { who: 'her', d: 0, a: 'f1', t: 'That’s the heartbreak. Hold one back for the regulars, and say plainly what’s left.' },
        { who: 'noor', d: 1, a: 's2', t: 'That matches what small studios report.' },
        { who: 'bo', d: 1, a: 'held', t: 'Then we hold it for them till ten.', did: 'Added a hold till ten', fx: () => { $('#held').classList.remove('hide'); } } ] } ],
    take: { believe: ['A regular should never find their bread gone.'], guide: [['Hold their usual till ten; say plainly what’s left.']] },
  },
};
const M = WORK[W];

function cut(a) { const f = $(`#wire [data-a="${a}"]`); f && f.classList.add('cut'); }
function weekly() { const w = $('#weekly'); if (!w) return; w.style.transition = 'height .6s var(--ip-land), padding .6s var(--ip-land)'; w.style.height = '26px'; w.style.paddingBottom = '12px'; setTimeout(placePins, 650); }

function entryHTML(e, ri, ei) {
  return `<div class="e${e.who === 'her' ? ' hers' : ''}" data-who="${e.who}" data-d="${e.d}" data-k="${ri}-${ei}"><b><i></i>${NAME[e.who]}</b><p>${e.t}</p>${e.did ? `<span class="did">${e.did}</span>` : ''}</div>`;
}
function roundHTML(r, ri) {
  const dots = [...new Set(r.entries.map(e => e.who))].map(w => `<i data-who="${w}"></i>`).join('');
  return `<div class="round" id="r${ri}"><div class="rh">Round ${ri + 1}</div>
    <div class="sum"><span class="dots">${dots}</span><span>${r.sum}</span><span class="open">Open</span></div>
    <div class="entries">${r.entries.map((e, ei) => entryHTML(e, ri, ei)).join('')}</div></div>`;
}
const TURN = `<div class="turn" id="turn"><span class="wave"><i></i><i></i><i></i><i></i></span><span class="t" id="turnT">Your turn, whenever you’re ready</span><span class="mic">${MIC}</span></div>`;
function takeHTML(n, title = 'Your takeaways · growing as you talk', plain = false) {
  // one belief, one guidance that grows round by round; the newest sentence is softly marked
  const g = M.take.guide.slice(0, n).map((r, i) => r.map(t => (i === n - 1 && n > 1 && !plain) ? `<span class="new">${t}</span>` : t).join(' ')).join(' ');
  return `<div class="take" data-who="her" id="take"><span class="lab"><span>${title}</span><span class="reword">${PEN}Reword</span></span><p><b>What I believe</b>${M.take.believe.join(' ')}</p><p><b>Guidance</b>${g}</p></div>`;
}

// ---------- take one: the margin becomes the minutes ----------
function buildMinutes() {
  const d = $('#doc');
  d.innerHTML = `<div class="head"><div><div class="from" data-who="${W}"><i></i>${M.from}</div><div class="q">${M.q}</div></div>
      <div class="acts"><button class="btn quiet">Back to the room</button></div></div>
    <div class="art" id="art"><div class="cap"><span class="label">The work · always here</span></div><div class="stage">${M.art}</div></div>
    <div class="minutes" id="minutes"><div class="mh"><span class="label">The meeting · kept as notes</span></div>
      <div id="rounds"></div>${TURN}<div id="takeSlot"></div></div>`;
  InkPaper.dress(c);
}
// pins: one per entry, on the part it's about, in the author's crayon; several on one part sit side by side
function placePins() {
  const art = $('#art'); if (!art) return; const ab = art.getBoundingClientRect(); const per = {};
  $$('.pin', art).forEach(p => {
    const t = $(`[data-a="${p.dataset.a}"]`, art); if (!t) return; const r = t.getBoundingClientRect();
    const k = per[p.dataset.a] = (per[p.dataset.a] || 0) + 1;
    p.style.left = (r.right - ab.left + 8 + (k - 1) * 22) + 'px'; p.style.top = (r.top - ab.top + 10) + 'px';
  });
}
function addPin(e, key) {
  const p = document.createElement('div'); p.className = 'pin'; p.dataset.who = e.who; p.dataset.a = e.a; p.dataset.k = key;
  p.innerHTML = `<span>${e.who === 'her' ? 'P' : NAME[e.who][0]}</span>`; $('#art').appendChild(p); placePins(); return p;
}
// hover an entry and its pin glows, and the other way round
function link() {
  $('#c').addEventListener('mouseover', ev => { const k = ev.target.closest('[data-k]')?.dataset.k; $$('.lit').forEach(x => x.classList.remove('lit')); if (k) $$(`[data-k="${k}"]`).forEach(x => x.classList.add('lit')); });
}
function showRound(ri, upto = 99) {
  const host = $('#rounds'); if (!$('#r' + ri)) host.insertAdjacentHTML('beforeend', roundHTML(M.rounds[ri], ri));
  $$(`#r${ri} .e`).forEach((el, ei) => { el.classList.toggle('hide', ei > upto); });
  M.rounds[ri].entries.forEach((e, ei) => { if (ei <= upto && !$(`.pin[data-k="${ri}-${ei}"]`)) { addPin(e, `${ri}-${ei}`); e.fx && e.fx(); } });
}
function fold(ri) { $('#r' + ri).classList.add('folded'); $$(`.pin[data-k^="${ri}-"]`).forEach(p => p.classList.add('quiet')); }
function setTake(n) { $('#takeSlot').innerHTML = n ? takeHTML(n) : ''; if (n) InkPaper.dress($('#takeSlot')); }

function stillMinutes(s) {
  buildMinutes(); link();
  if (s >= 1) { showRound(0, 0); }
  if (s === 1) { const t = $('#turn'); t.classList.add('speaking'); $('#turnT').textContent = 'Listening… your words land in the thread when you send'; }
  if (s >= 2) { showRound(0); setTake(1); }
  if (s === 3) $$('[data-k="0-2"]').forEach(x => x.classList.add('lit'));
  if (s >= 4 && M.rounds[1]) { fold(0); showRound(1); setTake(2); }
  requestAnimationFrame(() => { placePins(); $$('.pane').forEach(InkPaper.redraw); });
}

// ---------- take two: tabs on the sheet ----------
function buildTabs(tab) {
  const d = $('#doc'); const M = WORK.mika;
  d.innerHTML = `<div class="head"><div><div class="from" data-who="mika"><i></i>${M.from}</div><div class="q">${M.q}</div></div>
      <div class="acts"><button class="btn quiet">Back to the room</button></div></div>
    <div class="sheettabs"><div class="tabs"><span class="${tab === 'work' ? 'on' : ''}">Work</span><span class="${tab === 'conv' ? 'on' : ''}">Conversation</span><span class="${tab === 'write' ? 'on' : ''}">Write-up</span></div></div>
    <div id="body"></div><div class="voicebar">${TURN}</div>`;
  const b = $('#body');
  if (tab === 'work') {
    b.innerHTML = `<div class="art" id="art"><div class="cap"><span class="label">Tap a pin to see what was said there</span></div><div class="stage">${M.art}</div></div>`;
    M.rounds.forEach((r, ri) => r.entries.forEach((e, ei) => { addPin(e, `${ri}-${ei}`); e.fx && e.fx(); }));
    $$('.pin').forEach(p => { if (!p.dataset.k.startsWith('1-')) p.classList.add('quiet'); });
    // one pin open: the conversation lives where it happened
    const open = M.rounds[1].entries[1];
    b.insertAdjacentHTML('beforeend', `<div class="pinned" id="pinned">${entryHTML(open, 1, 1).replace('class="e', 'class="e bubble')}</div>`);
    setTimeout(() => { const pin = $('.pin[data-k="1-1"]'), pb = pin.getBoundingClientRect(), ab = $('#art').getBoundingClientRect();
      const pp = $('#pinned'); pp.style.left = (pb.right - ab.left + 70) + 'px'; pp.style.top = (pb.top - ab.top + 150) + 'px'; pin.classList.add('lit'); InkPaper.redraw($('#pinned .bubble')); }, 700);
  }
  if (tab === 'conv') {
    b.innerHTML = `<div class="conv"><div class="threadcol" id="rounds"></div><div><span class="label">The work, still here</span><div class="mini" style="margin-top:10px">${M.art.replace('id="wire"', 'id="wire2"')}</div></div></div>`;
    b.querySelector('#rounds').innerHTML = M.rounds.map(roundHTML).join('');
    ['phone', 'login'].forEach(a => $(`#wire2 [data-a="${a}"]`).classList.add('cut'));
    const w = $('#wire2 #weekly'); w.style.height = '26px'; w.style.paddingBottom = '12px';
  }
  if (tab === 'write') {
    b.innerHTML = `<div class="write"><div>${takeHTML(2, 'Your takeaways · in your words', true)}</div>
      <div class="changes"><span class="label">What changed in the work</span>
        ${[['mika', 'The phone field is gone'], ['bo', 'No sign-in; regulars are remembered'], ['ines', 'A quiet weekly line under their usual']].map(([w, t]) => `<div class="ch" data-who="${w}"><i></i>${t}</div>`).join('')}
        <span class="label" style="margin-top:14px">From the conversation</span>
        ${M.rounds.map((r, i) => `<div class="ch" data-who="her" style="font-style:italic"><i></i>Round ${i + 1} · ${r.sum}</div>`).join('')}</div></div>`;
  }
  InkPaper.dress(c);
  requestAnimationFrame(() => { placePins(); $$('.pane').forEach(InkPaper.redraw); });
}

// ---------- back in the room ----------
function room() {
  $('#doc').remove(); $('#veil').remove(); c.classList.add('v-room');
  $('#roomParts').innerHTML = `<div class="abs sheet table" data-who="her"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">By Mika · wireframes</span><div class="tabs"><span>Journey</span><span class="on">Screens</span><span>Page</span></div></div>
    <h3>Ordering, for regulars and newcomers</h3><div class="steps"><span class="step hers">Their usual loaf</span><span class="step">Name only</span><span class="step">Pick-up time</span></div></div>
    <div class="abs note mnotes" data-who="her"><span class="lab"><i></i>Meeting notes</span>How ordering should feel · two rounds, your takeaways</div>
    <div class="abs bubble" data-who="mika" style="left:200px;top:226px;width:280px"><b>Mika</b>Phone field’s gone. Weekly line next.</div>`;
  InkPaper.dress(c); InkPaper.talk($('#pMika'));
}

// ---------- the flow ----------
async function play() {
  buildMinutes(); link(); const d = $('#doc');
  animate(d, { opacity: [0, 1], scale: [.96, 1] }, spring(.6)); await wait(1400);
  const t = $('#turn'); t.classList.add('speaking'); $('#turnT').textContent = 'Listening…'; await wait(1800);
  t.classList.remove('speaking'); $('#turnT').textContent = 'Your turn, whenever you’re ready';
  const r0 = M.rounds[0];
  for (let ei = 0; ei < r0.entries.length; ei++) {
    showRound(0, ei); const el = $(`.e[data-k="0-${ei}"]`), pin = $(`.pin[data-k="0-${ei}"]`);
    animate(el, { opacity: [0, 1], y: [8, 0] }, spring(.45)); animate(pin, { opacity: [0, 1], scale: [.4, 1] }, spring(.4));
    if (ei === 1) { setTake(1); InkPaper.lay($('#take')); }
    await wait(ei === 0 ? 450 : 1200);
  }
  await wait(1000);
  // hover link
  $$('[data-k="0-2"]').forEach(x => x.classList.add('lit')); await wait(1200); $$('.lit').forEach(x => x.classList.remove('lit'));
  if (!M.rounds[1]) return;
  // round 2: round 1 folds to a line, its pins go quiet
  t.classList.add('speaking'); $('#turnT').textContent = 'Listening…'; await wait(1400); t.classList.remove('speaking'); $('#turnT').textContent = 'Your turn, whenever you’re ready';
  fold(0);
  for (let ei = 0; ei < M.rounds[1].entries.length; ei++) {
    showRound(1, ei); const el = $(`.e[data-k="1-${ei}"]`), pin = $(`.pin[data-k="1-${ei}"]`);
    animate(el, { opacity: [0, 1], y: [8, 0] }, spring(.45)); animate(pin, { opacity: [0, 1], scale: [.4, 1] }, spring(.4));
    if (ei === 1) setTake(2);
    await wait(ei === 0 ? 450 : 1300);
  }
  await wait(1800);
  await animate(d, { opacity: 0, scale: .96 }, spring(.4)).finished; room();
}

if (V === 'room') room();
else if (V === 'tabs') buildTabs(TAB);
else if (PLAY) play();
else stillMinutes(S ?? 2);
</script>
</body>
</html>
