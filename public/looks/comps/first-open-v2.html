<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The first open · on paper, then the room</title>
<!-- The very first open (Vincent, 14 Nov evening): she doesn't see the room until the end. Everything before it is on
     paper, on a warm plain ground. 1 her name · 2 her craft · 3 she says what she loves, in her own words, and the rough
     words are tidied into her name tag · 4 she meets the team one by one · 5 THE REVEAL: the paper parts, the living room
     is there with everyone seated, and her tag flies to her pink stool and she sits down.
     ?step=0..11 &still=1 for a moment; no step autoplays the whole flow (about 50 s). &late=1: the flex teammate is
     running late. Ink-paper (../ink-paper.css, ../ink-paper.js); clips from the living painting (first-open/cast/). -->
<link rel="stylesheet" href="../ink-paper.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #1A120D; }
.canvas { position: relative; width: 1600px; height: 900px; overflow: hidden; }
.abs { position: absolute; }
.hide { display: none !important; }
.canvas .abs.pane { position: absolute; }

/* ---------- the room, waiting behind the paper ---------- */
.room { position: absolute; inset: 0; background: url(first-open/cast/painting-afternoon.jpg) center top / 1600px 893px no-repeat, #6E4B33; transform-origin: 690px 640px; }
.room video { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; object-fit: cover; object-position: center top; }
.warm { position: absolute; left: 520px; top: 600px; width: 340px; height: 260px; border-radius: 50%; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(closest-side, rgba(255,232,200,.85), rgba(255,220,186,.35) 58%, rgba(255,210,170,0)); }
.teampills .pill { position: absolute; opacity: 0; }

/* ---------- the paper: two leaves that part for the reveal ---------- */
.leaf { position: absolute; top: -20px; bottom: -20px; width: 830px; background: #EFE3CD var(--ip-tooth); z-index: 10; }
.leaf.l { left: -20px; } .leaf.r { right: -20px; z-index: 9; }
.parting .leaf.l { box-shadow: 14px 0 28px -10px rgba(40,20,5,.45); } .parting .leaf.r { box-shadow: -14px 0 28px -10px rgba(40,20,5,.45); }
.leaf::after { opacity: 0; } .parting .leaf::after { opacity: 1; }
.stepcard .btn, .tag-her .btn { height: 54px; padding: 0 26px; font-size: 18px; }
.mic { height: 54px !important; font-size: 17px !important; } .see { font-size: 16px !important; }
.leaf::after { content: ''; position: absolute; top: 0; bottom: 0; width: 22px; background: inherit; filter: url(#ip-tear); }
.leaf.l::after { right: -10px; } .leaf.r::after { left: -10px; }
.leaf .edge { position: absolute; top: 0; bottom: 0; width: 8px; background: var(--ip-her); -webkit-mask: var(--ip-wax) 0 0 / 120px 120px; mask: var(--ip-wax) 0 0 / 120px 120px; filter: url(#ip-tear); opacity: 0; }
.leaf.l .edge { right: -6px; } .leaf.r .edge { left: -6px; }
.ground { position: absolute; inset: 0; z-index: 11; pointer-events: none; }
.ground > * { pointer-events: auto; }

/* ---------- the steps, one sheet at a time, centred ---------- */
.stepcard { left: 450px; width: 700px; top: 200px; }
.canvas .stepcard { padding: 32px 38px 32px; zoom: 1; }
.stepcard .lab { font-size: 15px; }
.kicker { color: var(--ip-her-t) !important; }
.stepcard h2 { margin: 10px 0 8px; font: 400 38px/1.15 var(--ip-serif); letter-spacing: -.012em; }
.stepcard .sub { margin: 0 0 24px; font: italic 400 21px/1.35 var(--ip-serif); color: var(--ip-ink-2); }
.field { display: flex; align-items: center; height: 64px; padding: 0 22px; border-radius: 999px; background: var(--ip-inset); box-shadow: inset 0 0 0 1.5px rgba(212,114,136,.5);
  font: 400 27px/1 var(--ip-serif); color: var(--ip-ink); }
.caret { display: inline-block; width: 1.5px; height: 22px; background: var(--ip-her-t); margin-left: 1px; }
.row-end { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 18px; }
.row-end .see { margin-right: auto; }
.choices { display: flex; flex-wrap: wrap; gap: 9px; }
.choice { display: inline-flex; align-items: center; gap: 9px; height: 52px; padding: 0 21px; border-radius: 999px; border: 0; cursor: pointer; background: #FFFDF8;
  font: 500 19px/1 var(--ip-sans); color: var(--ip-ink); box-shadow: inset 0 0 0 1.5px rgba(59,42,32,.2); transition: translate .18s var(--ip-land), box-shadow .18s; }
.choice i { width: 22px; height: 22px; border-radius: 50%; background: var(--ip-her); margin-left: -8px; }
.choice.on { background: var(--ip-paper-her); box-shadow: inset 0 0 0 1.5px var(--ip-her); }
.choice.own { flex-basis: 100%; justify-content: center; font: italic 400 22px/1 var(--ip-serif); color: var(--ip-ink-2); }
.choice.is-hover { translate: 0 -2px; box-shadow: inset 0 0 0 1.5px var(--ip-her), var(--ip-lift); }
/* speaking: her rough words in soft grey, then tidied into her pink */
.speak { min-height: 180px; padding: 22px 24px; border-radius: var(--ip-r-md); background: var(--ip-inset); box-shadow: inset 0 0 0 1.5px rgba(212,114,136,.4);
  font: italic 400 27px/1.5 var(--ip-serif); color: #64503F; }
.speak .tk { display: inline-block; margin-right: .26em; }
.speak .tk.filler { color: #7A6656; }
.speak.clean { color: var(--ip-her-t); font-style: italic; }
.mic { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px 0 8px; border-radius: 999px; background: var(--ip-paper-her); box-shadow: inset 0 0 0 1.5px rgba(212,114,136,.55);
  font: 500 15px/1 var(--ip-sans); color: var(--ip-her-t); }
.mic .ring { width: 32px; height: 32px; border-radius: 50%; background: var(--ip-her-t); display: grid; place-items: center; transition: box-shadow .1s; }
.mic svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; }
.see { font: 500 14px/1 var(--ip-sans); color: var(--ip-ink-2); text-decoration: underline; text-underline-offset: 3px; }
/* her name tag: the name the team will know her by */
.tag-her { left: 500px; width: 600px; top: 210px; }
.canvas .tag-her { padding: 22px 26px 22px; }
.tag-her > .gl { --sheet: var(--ip-paper-her); }
.tag-her .who { display: flex; align-items: center; gap: 16px; margin: 10px 0 14px; }
.tag-her .seal { width: 74px; height: 74px; border-radius: 50%; background: var(--ip-her-t); color: #fff; display: grid; place-items: center; font: 500 27px/1 var(--ip-serif); flex: none; }
.tag-her .name { font: 400 46px/1 var(--ip-serif); letter-spacing: -.01em; }
.tag-her .title { font: italic 400 30px/1.2 var(--ip-serif); color: var(--ip-her-t); margin-top: 5px; }
.tag-her .traits { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-her .traits span { height: 32px; padding: 0 13px; display: inline-flex; align-items: center; border-radius: 999px; background: rgba(255,253,248,.88); font: 500 14px/1 var(--ip-sans); color: var(--ip-ink-2); }
.tag-her .kn { margin: 16px 0 0; font: italic 400 16px/1.35 var(--ip-serif); color: var(--ip-ink-2); }
.tagline { left: 0; right: 0; top: 230px; text-align: center; font: italic 400 20px/1.3 var(--ip-serif); color: var(--ip-ink-2); }
/* meeting the team: a close-up in an inked oval, and their card */
.meet { left: 0; right: 0; top: 0; bottom: 0; }
.oval { position: absolute; left: 330px; top: 170px; width: 400px; height: 440px; border-radius: 50%; overflow: hidden; background: #EADBC0; }
.oval::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(239,227,205,0) 62%, rgba(239,227,205,.55) 84%, rgba(239,227,205,.92) 100%); }
.oval video { position: absolute; width: 1060px; height: 1060px; }
.oval-ink { position: absolute; left: 324px; top: 164px; width: 412px; height: 452px; overflow: visible; pointer-events: none; }
.oval-ink ellipse { fill: none; stroke: #4A3020; stroke-width: 2; stroke-opacity: .85; }
.oval-cr { position: absolute; left: 342px; top: 186px; width: 400px; height: 440px; border-radius: 50%; background: var(--c); -webkit-mask: var(--ip-wax) 0 0 / 240px 240px; mask: var(--ip-wax) 0 0 / 240px 240px; filter: url(#ip-tear); }
.mcard { left: 800px; top: 250px; width: 460px; }
.canvas .mcard { padding: 22px 26px 24px; }
.mcard .nm { font: 400 40px/1 var(--ip-serif); color: var(--t); letter-spacing: -.01em; }
.mcard .rl { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; font: 500 15px/1 var(--ip-sans); color: var(--ip-ink-2); }
.mcard .rl b { font-weight: 500; color: var(--t); }
.mcard .line { margin: 18px 0 10px; font: italic 400 22px/1.4 var(--ip-serif); }
.mcard .brings { font: 400 16px/1.4 var(--ip-sans); color: var(--ip-ink-2); }
.mcard .brings b { font-weight: 500; color: var(--ip-ink); }
.count-dots { position: absolute; left: 0; right: 0; top: 700px; display: flex; justify-content: center; gap: 10px; }
.count-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); opacity: .3; transition: opacity .4s; }
.count-dots i.on { opacity: .55; }
.late-note { left: 800px; top: 270px; width: 440px; rotate: -2deg; }
.canvas .late-note { padding: 22px 26px; }
.late-note .hand { font: 500 14px/1 var(--ip-sans); color: var(--t); }
.late-note p { margin: 10px 0 0; font: italic 400 22px/1.4 var(--ip-serif); }
.empty-oval { position: absolute; left: 330px; top: 170px; width: 400px; height: 440px; border-radius: 50%; background: #E6D6BA var(--ip-tooth); display: grid; place-items: center; }
.empty-oval span { font: italic 400 20px/1.3 var(--ip-serif); color: var(--ip-ink-2); text-align: center; }

#replay { position: absolute; right: 22px; top: 18px; z-index: 30; opacity: 0; }
#pointer { position: absolute; left: 0; top: 0; width: 24px; height: 24px; z-index: 50; pointer-events: none; opacity: 0; }
#pointer::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: rgba(255,250,240,.85); box-shadow: 0 0 0 1.5px rgba(70,45,25,.55), 0 4px 10px rgba(30,15,5,.4); }
</style>
</head>
<body>
<div class="canvas ink-paper" id="c">
  <div class="room" id="room"><video id="scene" muted loop playsinline preload="auto" src="first-open/cast/scene-afternoon.webm"></video></div>
  <div class="warm" id="warm"></div>
  <div class="teampills" id="teampills">
    <button class="pill" data-who="mika" style="left:404px;top:304px"><span class="dot"></span><span class="nm">Mika</span><span class="agent">agent</span></button>
    <button class="pill" data-who="noor" style="left:612px;top:290px"><span class="dot"></span><span class="nm">Noor</span><span class="agent">agent</span></button>
    <button class="pill" data-who="theo" style="left:790px;top:322px"><span class="dot"></span><span class="nm">Theo</span><span class="agent">agent</span></button>
    <button class="pill" data-who="ines" style="left:1060px;top:232px"><span class="dot"></span><span class="nm">Ines</span><span class="agent">agent</span></button>
    <button class="pill" data-who="bo" style="left:1150px;top:372px"><span class="dot"></span><span class="nm">Bo</span><span class="agent">agent</span></button>
  </div>
  <div class="leaf l" id="leafL"><span class="edge"></span></div>
  <div class="leaf r" id="leafR"><span class="edge"></span></div>
  <div class="ground" id="ground"></div>
  <span class="tag replay" id="replay">Replay<small>recorded run</small></span>
  <div id="pointer"></div>
</div>
<script src="../../vendor/motion/motion.js"></script>
<script src="../ink-paper.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search), STEP = q.get('step'), still = q.get('still') === '1', LATE = q.get('late') === '1';
  const instant = still || STEP != null, N = STEP == null ? 99 : +STEP;
  const c = document.getElementById('c'), ground = document.getElementById('ground'), $ = s => c.querySelector(s), { animate } = Motion;
  const spring = (d = .5) => ({ type: 'spring', visualDuration: d, bounce: 0 });
  const wait = ms => new Promise(r => setTimeout(r, instant ? 0 : ms));
  const A = (el, k, o) => animate(el, k, instant ? { duration: 0 } : o);
  InkPaper.dress(c);
  let lateDone = false;

  // one sheet on the paper at a time: the old one lifts away, the new one is laid with the ink gesture
  let cur = null;
  async function sheet(html, cls = 'stepcard', who = 'her') {
    if (cur) { const old = cur; cur = null; if (!instant) await animate(old, { opacity: 0, y: -14 }, { duration: .35, ease: [.4, 0, .6, 1] }).finished; old.remove(); }
    const el = document.createElement('div'); el.className = 'abs card ' + cls; el.dataset.who = who; el.innerHTML = html; ground.appendChild(el);
    InkPaper.dress(el); InkPaper.redraw(el); el.querySelectorAll('.pane').forEach(InkPaper.redraw);
    if (!instant) InkPaper.lay(el); cur = el; return el;
  }
  const typeIn = async (el, text, ms = 70) => { if (instant) { el.textContent = text; return; } for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await wait(ms); } };
  const ptr = $('#pointer');
  const at = el => { const r = el.getBoundingClientRect(), cr = c.getBoundingClientRect(); return { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2 }; };
  const tap = async el => { if (instant) return; animate(ptr, { opacity: 1 }, { duration: .2 }); await animate(ptr, { x: at(el).x - 12, y: at(el).y - 12 }, spring(.7)).finished; el.classList.add('is-hover'); await wait(200);
    await animate(ptr, { scale: [1, .8, 1] }, { duration: .28 }).finished; el.classList.remove('is-hover'); };
  const hidePtr = () => { if (!instant) animate(ptr, { opacity: 0 }, { duration: .3 }); };

  // the casting for her seat (design/studio/SEATS.md): she took Product
  const TEAM = [
    { who: 'mika', name: 'Mika', role: 'Design', line: 'I sketch it rough first, then we make it lovely together.', brings: 'Journeys, wireframes and the look of the page.', head: [.44, .56] },
    { who: 'noor', name: 'Noor', role: 'Research', line: 'Every claim gets a source. I’ll find out what your customers really do.', brings: 'Customer evidence, with the sources linked.', head: [.48, .56] },
    { who: 'bo',   name: 'Bo',   role: 'Engineering', line: 'Boring, correct, shipped. Leave the logins and payments to me.', brings: 'The working site, end to end.', head: [.42, .48] },
    { who: 'ines', name: 'Ines', role: 'Strategy', line: 'Who pays, and why now? I’ll keep us honest about the business.', brings: 'The business case, and the map of where this goes.', head: [.44, .54] },
    { who: 'theo', name: 'Theo', role: 'Data', line: 'For this one, I’ll keep the morning bake list: what to bake, counted from the orders.', brings: 'Tomorrow’s list, and one number that says it worked.', head: [.47, .58], flex: true },
  ];
  // her words, rough then tidied: each token is kept (1), dropped (0), or becomes something else
  const RAW = [['um', 0], ['so', 0], ['I', 1], ['really', 0], ['love', 1], ['the,', 0], ['like,', 0], ['the', 1], ['customer', 1], ['journey', 'journey:'], ['you', 0], ['know,', 0],
    ['figuring', 1], ['out', 1], ['what’s', 1], ['actually', 1], ['bugging', 1], ['people', 'people,'], ['and', 1], ['then', 0], ['uh', 0], ['building', 1], ['the', 1], ['thing', 1], ['that', 1], ['fixes', 1], ['it', 'it.']];
  // only clean: no new claims, no new content, no softening. Her words stay hers; only fillers and repeats go.

  (async () => {
    await document.fonts.ready;
    animate(ptr, { x: 1200, y: 820 }, { duration: 0 });
    // ---- 0 her name ----
    let s = await sheet(`<span class="lab kicker">Welcome to the studio</span><h2>What should the team call you?</h2><p class="sub">Your first name is plenty.</p>
      <div class="field"><span id="nm"></span><span class="caret"></span></div><div class="row-end"><button class="btn" id="go1">That’s me</button></div>`);
    await wait(900); await typeIn(s.querySelector('#nm'), 'Priya', 120); if (N < 1) return;
    await wait(500); await tap(s.querySelector('#go1'));
    // ---- 1 her craft ----
    s = await sheet(`<span class="lab kicker">Hello, Priya</span><h2>What do you bring to the table?</h2><p class="sub">Pick your craft. The team fills every other seat.</p>
      <div class="choices"><button class="choice on" id="pr"><i></i>Product</button><button class="choice">Design</button><button class="choice">Research</button><button class="choice">Engineering</button>
      <button class="choice">Data</button><button class="choice">Strategy</button><button class="choice own">Your own craft</button></div>
      <div class="row-end"><button class="btn" id="go2">Product it is</button></div>`);
    if (N < 2) return;
    await wait(1600); await tap(s.querySelector('#go2'));
    // ---- 2 she says what she loves, rough ----
    s = await sheet(`<span class="lab kicker">Product, in your own words</span><h2>What do you love about it, and what do you bring?</h2><p class="sub">Just talk. Ums and all.</p>
      <div class="speak" id="speak"></div>
      <div class="row-end"><span class="mic" id="mic"><span class="ring"><svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 8a5 5 0 0010 0M8 13v2"/></svg></span>Hold to talk</span></div>`, 'stepcard', 'her');
    const sp = s.querySelector('#speak'), ring = s.querySelector('.ring');
    if (!instant) { await wait(700); hidePtr(); s.querySelector('#mic').lastChild.textContent = 'Listening… take your time'; }
    const pulse = !instant && setInterval(() => ring.style.boxShadow = `0 0 0 ${(3 + Math.random() * 7).toFixed(1)}px rgba(212,114,136,.3)`, 120);
    const tks = RAW.map(t => { const e = document.createElement('span'); e.className = 'tk' + (t[1] === 0 ? ' filler' : ''); e.textContent = t[0]; e._t = t; return e; });
    for (const e of tks) { sp.appendChild(e); if (!instant) { A(e, { opacity: [0, 1] }, { duration: .25 }); await wait(e._t[1] === 0 ? 240 : 150); } }
    if (pulse) clearInterval(pulse); ring.style.boxShadow = ''; s.querySelector('#mic').lastChild.textContent = 'Hold to talk';
    InkPaper.redraw(s); if (N < 3) return;
    // ---- 3 the tidy: fillers fold away, the words close up, the ink dries into her pink ----
    await wait(700);
    const before = new Map(tks.map(e => [e, e.getBoundingClientRect()]));
    const drop = tks.filter(e => e._t[1] === 0), change = tks.filter(e => typeof e._t[1] === 'string');
    drop.forEach(e => A(e, { opacity: 0, filter: ['blur(0px)', 'blur(2px)'] }, { duration: .28 }));
    await wait(260); drop.forEach(e => e.style.display = 'none'); change.forEach(e => e.textContent = e._t[1]);
    tks[2].textContent = 'I'; const keep = tks.filter(e => e._t[1] !== 0);
    if (!instant) keep.forEach(e => { const b = before.get(e), n = e.getBoundingClientRect(); animate(e, { x: [b.left - n.left, 0], y: [b.top - n.top, 0] }, spring(.5)); });
    sp.classList.add('clean');
    keep.forEach((e, i) => A(e, { color: ['#64503F', '#93374F'] }, { duration: .9, delay: .12 + i * .03, ease: 'easeOut' }));
    s.querySelector('.row-end').insertAdjacentHTML('afterbegin', '<a class="see" href="#">See what you said</a>');
    InkPaper.redraw(s); if (N < 4) return;
    // ---- 4 her name tag: the team's spin on what she said ----
    await wait(2200);
    s = await sheet(`<span class="lab kicker">The name your teammates will know you as</span>
      <div class="who"><span class="seal">P</span><div><div class="name">Priya</div><div class="title">the Customer Whisperer</div></div></div>
      <div class="traits"><span>customer-obsessed</span><span>hands-on builder</span><span>problem hunter</span></div>
      <p class="kn">From what you said: the journey, the problem, and the thing that fixes it.</p>
      <div class="row-end"><button class="btn quiet">Change a word</button><button class="btn" id="go4">Meet your team</button></div>`, 'tag-her', 'her');
    if (N < 5) return;
    await wait(2600); await tap(s.querySelector('#go4')); hidePtr();
    // her tag goes small to the top left, and stays with her while she meets the team
    if (!instant) await animate(s, { opacity: 0, scale: .9 }, { duration: .4 }).finished; s.remove(); cur = null;
    const mini = document.createElement('button'); mini.className = 'abs pill is-her'; mini.dataset.who = 'her'; mini.id = 'mini';
    mini.style.cssText = 'left:22px;top:18px;z-index:12'; mini.innerHTML = '<span class="dot">P</span><span class="nm">Priya</span><span class="agent">the Customer Whisperer</span>';
    ground.appendChild(mini); InkPaper.dress(mini); InkPaper.redraw(mini); if (!instant) InkPaper.lay(mini);
    const dots = document.createElement('div'); dots.className = 'count-dots'; dots.innerHTML = TEAM.map(t => `<i data-who="${t.who}"></i>`).join(''); ground.appendChild(dots);
    // ---- 5..9 meet the team, one by one; the flex teammate last ----
    for (let k = 0; k < TEAM.length && 5 + k <= N; k++) {
      const t = TEAM[k];
      if (cur) { const old = cur; cur = null; if (!instant) await animate(old, { opacity: 0, x: -40 }, { duration: .4, ease: [.4, 0, .6, 1] }).finished; old.remove(); }
      const m = document.createElement('div'); m.className = 'abs meet'; m.dataset.who = t.who; ground.appendChild(m); cur = m;
      const late = t.flex && LATE && !lateDone;
      const vx = 200 - t.head[0] * 1060, vy = 236 - t.head[1] * 1060;
      m.innerHTML = `<div class="oval-cr"></div>` + (late ? `<div class="empty-oval"><span>An empty chair,<br>for now</span></div>` :
        `<div class="oval"><video muted loop playsinline autoplay preload="auto" src="first-open/cast/${t.who}-idle.webm" style="left:${vx}px;top:${vy}px"></video></div>`) +
        `<svg class="oval-ink" viewBox="0 0 412 452"><g style="filter:url(#ip-wob${k + 2})"><ellipse cx="206" cy="226" rx="200" ry="220" pathLength="1"/></g></svg>` +
        (late ? `<div class="abs card late-note"><span class="hand">A note on Theo’s chair</span><p>Theo’s running a little late: we’re finding you someone who knows morning bake lists.</p></div>` :
        `<div class="abs card mcard"><div class="nm">${t.name}</div><div class="rl">agent · <b class="rr">${t.flex ? '' : t.role}</b></div><p class="line"></p><div class="brings"><b>Brings</b> ${t.brings}</div></div>`);
      InkPaper.dress(m); m.querySelectorAll('.pane').forEach(InkPaper.redraw);
      const ov = m.querySelector('.oval, .empty-oval'), ink = m.querySelector('.oval-ink ellipse'), card = m.querySelector('.card');
      dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i <= k));
      if (!instant) {
        animate(m.querySelector('.oval-cr'), { opacity: [0, 1], x: [-20, 0], y: [-12, 0] }, spring(.5));
        animate(ov, { opacity: [0, 1], scale: [.94, 1] }, { ...spring(.6), delay: .15 });
        ink.style.strokeDasharray = 1; animate(ink, { strokeDashoffset: [1, 0] }, { duration: 1, delay: .3, ease: [.45, .05, .25, 1] });
        InkPaper.lay(card, .45);
      }
      if (late) { await wait(3600); if (N === 9 && STEP != null) return;
        // the role is ready: the note lifts away and Theo is there
        if (!instant) await animate(m, { opacity: 0 }, { duration: .4 }).finished; m.remove(); cur = null; lateDone = true; k--; continue; }
      const rr = card.querySelector('.rr'), ln = card.querySelector('.line');
      if (t.flex) { await wait(800); await typeIn(rr, t.role === 'Data' ? 'Morning bake list' : t.role, 55); }
      await wait(500); await typeIn(ln, t.line, 20); InkPaper.redraw(card);
      if (k < TEAM.length - 1) await wait(1700);
    }
    if (N < 10) return;
    // ---- 10 THE REVEAL: the paper parts, the room is there, she sits down ----
    await wait(2000);
    if (cur) { const old = cur; cur = null; if (!instant) await animate(old, { opacity: 0, scale: .97 }, { duration: .5 }).finished; old.remove(); }
    dots.remove();
    const tag = $('#mini'); const vid = $('#scene'); vid.play().catch(() => {});
    const room = $('#room'), L = $('#leafL'), R = $('#leafR');
    if (!instant) {
      // her tag lifts to the centre while the leaves begin to part
      await animate(tag, { left: (800 - tag.offsetWidth / 2) + 'px', top: '430px', scale: 1.25 }, spring(1)).finished;
      await wait(500);
      c.classList.add('parting'); L.querySelector('.edge').style.opacity = 1; R.querySelector('.edge').style.opacity = 1;
      animate(room, { scale: [1.07, 1], filter: ['brightness(.82)', 'brightness(1)'] }, { duration: 3.6, ease: [.33, 0, .2, 1] });
      animate(L, { x: [0, -870] }, { duration: 3.0, ease: [.7, 0, .2, 1] });
      await animate(R, { x: [0, 870] }, { duration: 3.0, ease: [.7, 0, .2, 1] }).finished;
    } else { L.style.display = R.style.display = 'none'; }
    $('#replay').style.opacity = 1;
    if (N < 11) return;
    // hold the whole room for a beat, so everyone at the table is seen first; then she sits
    await wait(1800);
    A(tag, { left: '584px', top: '616px', scale: 1 }, { type: 'spring', visualDuration: 1.4, bounce: 0 });
    await wait(700);
    A('#warm', { opacity: [0, 1] }, { duration: 1.6, ease: 'easeInOut' });
    await wait(500);
    c.querySelectorAll('.teampills .pill').forEach((p, i) => { p.style.opacity = 1; InkPaper.redraw(p); if (!instant) InkPaper.lay(p, i * .12); });
  })();
})();
</script>
