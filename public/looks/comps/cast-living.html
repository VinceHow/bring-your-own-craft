<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>The studio, a living painting</title>
<style>
/* The living painting. Every moving thing here is a short video loop made ahead of time with fal (Wan 3.0
   image-to-video) and played from files in public/looks/cast/living/. Nothing calls fal at demo time.
   Layers: 1) the room as one ambient 5 s loop per time of day (everyone breathes, steam, the cat);
           2) one soft-edged patch per teammate, playing 5 s mood clips that all start and end on the same painted
              rest frame, so a director can swap moods without a jump;
           3) speech slips, as in cast-room, and the time of day, quietly, top left.
   Keys: 1 idle · 2 working · 3 thinking · 4 talking · 5 delighted · 6 holding up a note · 7 signature move ·
         8 celebrating (everyone) · 0 or A back to auto · T next time of day.
   URL: ?time=morning|afternoon|building|evening pins the light; ?still=1 shows the rest frame; ?seg=30 seconds per time. */
@font-face { font-family: 'Newsreader'; src: url(../fonts/newsreader-var.woff2) format('woff2'); font-weight: 200 800; font-style: normal; font-display: block; }
@font-face { font-family: 'Newsreader'; src: url(../fonts/newsreader-italic-var.woff2) format('woff2'); font-weight: 200 800; font-style: italic; font-display: block; }
@font-face { font-family: 'Hanken Grotesk'; src: url(../fonts/hanken-grotesk-var.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
:root {
  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Hanken Grotesk', system-ui, sans-serif;
  --ink: #3A2A1E; --ink-2: #6B5644; --paper: #FFF8EC; --edge: rgba(92,62,38,.28);
  --design: #3F5A8C; --research: #C8643F; --data: #6F9273; --strategy: #B68A2E; --engineering: #C9A227;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #2B1E15; }
body { color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
.canvas { position: relative; width: 1600px; height: 900px; overflow: hidden; background: #E9D2AE; }

/* Wan's 16:9 frame is the painting's 1588 x 893 centre (x 6 to 1594), shown at 1600 x 900: k = 1600 / 1588 */
.room { position: absolute; inset: 0; width: 1600px; height: 900px; object-fit: fill; display: block; opacity: 0; }

/* patches: placed from painting px with k; masked by a soft ellipse per teammate */
.patch { position: absolute; opacity: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
.patch > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.patch video { opacity: 0; }
.patch video.on { opacity: 1; }
.patch img.rest { opacity: 1; }

/* the cat: a click target over the painted cat */
.cat { position: absolute; left: 326px; top: 696px; width: 190px; height: 112px; cursor: pointer; border-radius: 50%; }
.purr { position: absolute; font: italic 400 18px/1 var(--serif); color: var(--ink); opacity: 0; pointer-events: none; text-shadow: 0 0 8px rgba(255,248,236,.9); }

/* a line said aloud: small paper slip near the speaker, never addressed to her */
.say { position: absolute; z-index: 5; padding: 10px 15px 11px; background: var(--paper); border-radius: 14px;
  box-shadow: 0 1px 0 var(--edge), 0 10px 24px -14px rgba(60,36,18,.55); opacity: 0; pointer-events: none; transform-origin: var(--ox, 50%) 100%; }
.say::after { content: ''; position: absolute; bottom: -7px; left: var(--tail, 50%); width: 14px; height: 14px; margin-left: -7px; background: var(--paper); transform: rotate(45deg); border-radius: 0 0 3px 0; }
.say .n { display: flex; align-items: center; gap: 6px; font: 500 13px/1 var(--sans); color: var(--ink-2); margin-bottom: 5px; }
.say .n i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.say p { margin: 0; font: 400 19px/1.25 var(--serif); color: var(--ink); white-space: nowrap; }

.when { position: absolute; left: 24px; top: 22px; padding: 5px 12px 6px; border-radius: 999px; background: rgba(255,248,236,.9);
  box-shadow: 0 6px 14px -8px rgba(60,36,18,.6); font: italic 400 16px/1 var(--serif); color: var(--ink-2); pointer-events: none; }
.when span { display: inline-block; }
.keys { position: absolute; right: 24px; bottom: 20px; padding: 7px 12px 8px; border-radius: 10px; background: rgba(255,248,236,.86);
  font: 400 13px/1.35 var(--sans); color: var(--ink-2); pointer-events: none; opacity: 0; }
.keys b { font-weight: 500; color: var(--ink); }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <video class="room" data-t="morning"   muted playsinline loop preload="auto"><source src="../cast/living/scene-morning.webm" type="video/webm"><source src="../cast/living/scene-morning.mp4" type="video/mp4"></video>
  <video class="room" data-t="afternoon" muted playsinline loop preload="auto"><source src="../cast/living/scene-afternoon.webm" type="video/webm"><source src="../cast/living/scene-afternoon.mp4" type="video/mp4"></video>
  <video class="room" data-t="building"  muted playsinline loop preload="auto"><source src="../cast/living/scene-building.webm" type="video/webm"><source src="../cast/living/scene-building.mp4" type="video/mp4"></video>
  <video class="room" data-t="evening"   muted playsinline loop preload="auto"><source src="../cast/living/scene-evening.webm" type="video/webm"><source src="../cast/living/scene-evening.mp4" type="video/mp4"></video>
  <div id="patches"></div>
  <div class="cat" id="cat" title="Pet the cat"></div>
  <div class="when" id="when"><span>Afternoon</span></div>
  <div class="keys" id="keys"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="filters"></defs></svg>

<script src="../../vendor/motion/motion.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const still = q.get('still') === '1';
  const { animate } = window.Motion;
  const $ = (s, r = document) => r.querySelector(s);
  const canvas = $('#canvas');
  const spring = (d = .7) => ({ type: 'spring', bounce: 0, duration: d });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const BASE = '../cast/living/';
  const K = 1600 / 1588, OX = 6;                          // painting px (1600 x 893) -> page px

  // Each teammate's patch: a square crop of the painting (x, y, size in painting px), and where the head is (for slips).
  const CAST = {
    noor: { name: 'Noor', c: 'var(--research)',    x: 540,  y: 250, size: 340, head: [680, 330] },
    theo: { name: 'Theo', c: 'var(--data)',        x: 700,  y: 270, size: 320, head: [852, 352] },
    ines: { name: 'Ines', c: 'var(--strategy)',    x: 860,  y: 200, size: 360, head: [1020, 290] },
    mika: { name: 'Mika', c: 'var(--design)',      x: 350,  y: 300, size: 400, head: [470, 362] },
    bo:   { name: 'Bo',   c: 'var(--engineering)', x: 1010, y: 330, size: 400, head: [1190, 420], side: 'right' },
  };
  const MOODS = ['idle', 'working', 'thinking', 'talking', 'delighted', 'note', 'signature', 'celebrating'];
  const LOOPING = new Set(['idle', 'working', 'thinking']);   // moods that can repeat; the others play once
  const WORDS = { idle: 'idle', working: 'working', thinking: 'thinking', talking: 'talking', delighted: 'delighted',
    note: 'holding up a note', signature: 'signature move', celebrating: 'celebrating' };

  // The day. Lines from DEMO.md: Bo/Ines (8pm cut-off) and Noor/Bo (source, booking form). The rest are placeholders.
  const TIMES = {
    afternoon: { label: 'Afternoon', talk: [['bo', 'Orders after 8pm miss the morning bake.'], ['ines', 'Then a cut-off, and say it plainly.', 'signature'], ['mika', 'I’ll put 8pm right on the button.', 'signature']] },
    building:  { label: 'Afternoon, building her page', talk: [['noor', 'Found a source on what sells out first.', 'note'], ['theo', 'Sourdough, gone by ten. Every week.', 'signature'], ['bo', 'I’ll take the booking form.']] },
    evening:   { label: 'Evening', talk: [['bo', 'Booking form’s shipped.', 'signature'], ['ines', 'Good day. Same time tomorrow?', 'delighted']] },
    morning:   { label: 'Morning', talk: [['bo', 'Coffee’s on. It’s strong.'], ['mika', 'Perfect. I’ll start with the front page.', 'delighted']] },
  };
  const ORDER = ['afternoon', 'building', 'evening', 'morning'];
  const SEG = Number(q.get('seg') || 32) * 1000;
  const pinned = !!TIMES[q.get('time')];
  let now = pinned ? q.get('time') : 'afternoon';

  // Colour fits, so afternoon-painted patches sit in other light (see design/studio/cast-living/NOTES.md)
  let LIGHT = {};
  try { LIGHT = await (await fetch(BASE + 'light.json')).json(); } catch (e) { /* afternoon only */ }
  const defs = $('#filters');
  for (const [t, per] of Object.entries(LIGHT)) for (const [who, m] of Object.entries(per)) {
    defs.insertAdjacentHTML('beforeend', `<filter id="l-${who}-${t}" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${m.join(' ')} 0 0 0 1 0"/></filter>`);
  }

  // ---- the room
  const rooms = [...document.querySelectorAll('video.room')];
  function setRoom(t, instant) {
    for (const v of rooms) {
      const on = v.dataset.t === t;
      if (on) v.play().catch(() => {});
      if (instant) v.style.opacity = on ? 1 : 0;
      else animate(v, { opacity: on ? 1 : 0 }, { duration: 2.6, ease: 'easeInOut' }).finished.then(() => { if (!on) v.pause(); });
    }
    const w = $('#when span');
    if (instant) w.textContent = TIMES[t].label;
    else animate(w, { opacity: 0 }, { duration: .4 }).finished.then(() => { w.textContent = TIMES[t].label; animate(w, { opacity: 1 }, { duration: .6 }); });
  }

  // ---- patches
  const P = {};
  const box = $('#patches');
  for (const [id, c] of Object.entries(CAST)) {
    const el = document.createElement('div');
    el.className = 'patch'; el.dataset.who = id;
    Object.assign(el.style, { left: (c.x - OX) * K + 'px', top: c.y * K + 'px', width: c.size * K + 'px', height: c.size * K + 'px',
      webkitMaskImage: `url(${BASE}mask-${id}.png)`, maskImage: `url(${BASE}mask-${id}.png)` });
    const rest = new Image(); rest.className = 'rest'; rest.src = `${BASE}rest-${id}.jpg`; rest.alt = ''; el.append(rest);
    box.append(el);
    P[id] = { el, rest, vids: {}, cur: null, mood: 'rest', base: 'idle', queue: [], onStart: null };
  }

  function clip(id, mood) {
    const p = P[id];
    if (p.vids[mood] !== undefined) return p.vids[mood];
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    for (const [ext, type] of [['webm', 'video/webm'], ['mp4', 'video/mp4']]) {
      const s = document.createElement('source'); s.src = `${BASE}${id}-${mood}.${ext}`; s.type = type; v.append(s);
    }
    v.addEventListener('error', () => { p.vids[mood] = null; }, true);
    p.el.append(v); p.vids[mood] = v;
    return v;
  }

  const XFADE = .18;
  // Play a mood clip from its rest frame. A clip that is missing (not made yet) falls back to idle, then to the still rest frame.
  async function play(id, mood, cut = .18) {
    const p = P[id];
    let v = clip(id, mood);
    if (!v || v.error) { v = mood !== 'idle' ? clip(id, 'idle') : null; mood = 'idle'; }
    if (!v || v.error) { p.mood = 'rest'; return; }
    const prev = p.cur; p.cur = v; p.mood = mood;
    v.currentTime = 0; v.style.zIndex = 2; if (prev && prev !== v) prev.style.zIndex = 1;
    try { await v.play(); } catch (e) { return; }
    v.classList.add('on');
    if (!p.live) { p.live = true; p.el.style.opacity = 1; }   // a patch shows only once it has a real clip
    if (prev && prev !== v) animate(prev, { opacity: [1, 0] }, { duration: cut }).finished.then(() => { prev.classList.remove('on'); prev.style.opacity = ''; prev.pause(); });
    if (p.onStart) { const f = p.onStart; p.onStart = null; f(mood); }
    const next = () => p.queue[0] || (LOOPING.has(p.base) ? p.base : 'idle');
    const lead = () => (next() === mood ? .034 : XFADE);
    const tick = () => {
      if (p.cur !== v) return;
      if (v.duration && (v.ended || v.currentTime >= v.duration - lead())) play(id, p.queue.shift() || next());
      else requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // Ask for a mood at the next clean boundary (auto), or now with a short crossfade (keys).
  function want(id, mood, now = false) {
    const p = P[id];
    if (LOOPING.has(mood)) { p.base = mood; p.queue = []; } else p.queue = [mood];
    if (now) play(id, p.queue.shift() || mood, .35);
  }

  // ---- speech slips (as in cast-room)
  function headPoint(id) { const [x, y] = CAST[id].head; return [(x - OX) * K, y * K]; }
  function say(id, text) {
    const [x, y] = headPoint(id);
    const b = document.createElement('div');
    b.className = 'say'; b.style.setProperty('--c', CAST[id].c);
    b.innerHTML = `<div class="n"><i></i>${CAST[id].name}</div><p></p>`;
    b.querySelector('p').textContent = text;
    canvas.appendChild(b);
    const w = b.offsetWidth, h = b.offsetHeight;
    const anchor = CAST[id].side === 'right' ? x - 34 : x - w * .5;
    const left = Math.max(16, Math.min(1600 - 16 - w, anchor));
    let top = y - h - 22;
    for (const o of canvas.querySelectorAll('.say')) {
      if (o === b || o.dataset.gone) continue;
      if (left < o.offsetLeft + o.offsetWidth && left + w > o.offsetLeft && top < o.offsetTop + o.offsetHeight && top + h > o.offsetTop) top = o.offsetTop - h - 10;
    }
    b.style.left = left + 'px'; b.style.top = Math.max(12, top) + 'px';
    const tail = Math.max(20, Math.min(w - 20, x - left));
    b.style.setProperty('--tail', tail + 'px'); b.style.setProperty('--ox', tail + 'px');
    animate(b, { opacity: [0, 1], y: [8, 0], scale: [.96, 1] }, spring(.6));
    return b;
  }
  async function unsay(b) { if (!b) return; b.dataset.gone = 1; await animate(b, { opacity: 0, y: -4 }, { duration: .5, ease: 'easeOut' }); b.remove(); }

  // ---- the director: everyone keeps a base mood; about every 15 s a short exchange
  let auto = true;
  const busy = { morning: ['idle', 'idle', 'thinking'], afternoon: ['working', 'working', 'idle', 'thinking'],
    building: ['working', 'working', 'working', 'thinking'], evening: ['idle', 'idle', 'thinking'] };
  function drift() { if (!auto) return; for (const id of Object.keys(CAST)) if (!P[id].queue.length) P[id].base = pick(busy[now]); }

  async function exchange(lines) {
    let prev = null;
    for (const [id, text, after] of lines) {
      if (!auto) break;
      for (const o of Object.keys(CAST)) if (o !== id && !P[o].queue.length) P[o].base = 'thinking';   // listening
      // the slip appears when the talking clip actually starts (next clean boundary, at most 5 s)
      const started = new Promise(r => { P[id].onStart = r; });
      want(id, 'talking'); if (after) P[id].queue.push(after);
      await Promise.race([started, wait(5600)]);
      unsay(prev); prev = say(id, text);
      await wait(4200);
    }
    await wait(800); unsay(prev);
    // the table perks up at the end of an exchange
    for (const o of Object.keys(CAST)) if (Math.random() < .4 && !P[o].queue.length) P[o].queue = ['delighted'];
    drift();
  }

  // ---- time of day: patches are painted in afternoon light; elsewhere a fitted colour matrix tints them
  function lightPatches(t) {
    for (const id of Object.keys(CAST)) P[id].el.style.filter = (t === 'afternoon' || !LIGHT[t]) ? '' : `url(#l-${id}-${t})`;
  }
  async function setTime(t, instant) {
    now = t;
    if (instant) { setRoom(t, true); lightPatches(t); return; }
    // hide the patches at a rest frame (they match the room there), move the light, bring them back
    for (const id of Object.keys(CAST)) want(id, 'idle');
    await wait(5200);
    for (const id of Object.keys(CAST)) animate(P[id].el, { opacity: 0 }, { duration: .5 });
    setRoom(t);
    await wait(2700);
    lightPatches(t);
    for (const id of Object.keys(CAST)) if (P[id].live) animate(P[id].el, { opacity: 1 }, { duration: .6 });
    drift();
  }

  // ---- keys
  const keysEl = $('#keys');
  function flash(text) {
    keysEl.innerHTML = text;
    animate(keysEl, { opacity: [0, 1] }, { duration: .3 }).finished.then(() => wait(1800)).then(() => animate(keysEl, { opacity: 0 }, { duration: .6 }));
  }
  addEventListener('keydown', e => {
    const n = Number(e.key);
    if (n >= 1 && n <= 8) {
      auto = false; const m = MOODS[n - 1];
      for (const id of Object.keys(CAST)) { want(id, m, true); P[id].base = LOOPING.has(m) ? m : P[id].base; }
      flash(`Everyone: <b>${WORDS[m]}</b> · 0 for auto`);
    } else if (e.key === '0' || e.key.toLowerCase() === 'a') { auto = true; drift(); flash('<b>Auto</b>: a short exchange every 15 s'); }
    else if (e.key.toLowerCase() === 't') { const i = ORDER.indexOf(now); setTime(ORDER[(i + 1) % ORDER.length]); }
  });

  // ---- the cat: pet it and it purrs
  let petting = false;
  $('#cat').addEventListener('click', async () => {
    if (petting) return; petting = true;
    for (let i = 0; i < 3; i++) {
      const p = document.createElement('div'); p.className = 'purr'; p.textContent = 'prr';
      p.style.left = (380 + i * 40) + 'px'; p.style.top = (690 - i * 6) + 'px'; canvas.append(p);
      animate(p, { opacity: [0, 1, 0], y: [0, -30] }, { duration: 2, delay: i * .35, ease: 'easeOut' }).finished.then(() => p.remove());
    }
    await wait(2600); petting = false;
  });

  // ---- go
  setRoom(now, true); lightPatches(now);
  if (still) { for (const v of rooms) v.pause(); for (const id of Object.keys(CAST)) P[id].el.style.opacity = 1; return; }
  for (const id of Object.keys(CAST)) { P[id].base = pick(busy[now]); play(id, P[id].base); }
  let ti = ORDER.indexOf(now), t0 = performance.now();
  await wait(2500);
  for (;;) {
    if (auto) await exchange(TIMES[now].talk);
    await wait(15000 - 4000);
    if (!pinned && auto && performance.now() - t0 > SEG) { ti = (ti + 1) % ORDER.length; await setTime(ORDER[ti]); t0 = performance.now(); }
  }
})();
</script>
</body>
</html>
